<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meu Dinheiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07080B;
  --bg-elev:#0C0E12;
  --surface:#0F1115;
  --surface2:#151820;
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --text:#F1F2F4;
  --text2:#8A93A3;
  --text3:#525966;
  --accent:#5EEAD4;
  --accent-dim:rgba(94,234,212,.14);
  --accent-glow:rgba(94,234,212,.35);
  --green:#34D399;
  --red:#FB7185;
  --yellow:#FBBF24;
  --gold:#D9B36A;
  --nav-h:66px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:14px;
}
html,body{height:100%;background:radial-gradient(120% 60% at 50% -10%,#10141c 0%,#07080B 55%) fixed;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;overscroll-behavior:none;font-weight:400;}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;}

/* ── Header ── */
#header{position:relative;background:linear-gradient(180deg,rgba(15,17,21,.92),rgba(15,17,21,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 18px 12px;border-bottom:1px solid var(--border);z-index:10;flex-shrink:0;}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.app-title{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0;}
.app-title .mark{width:7px;height:7px;border-radius:2px;background:linear-gradient(135deg,var(--accent),#22D3EE);box-shadow:0 0 10px var(--accent-glow);flex-shrink:0;transform:rotate(45deg);}
.month-nav-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
#sync-indicator{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;min-width:0;}
.month-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.month-nav button{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:9px;width:30px;height:30px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;}
.month-nav button:active{border-color:var(--accent);color:var(--accent);}
.month-label{font-size:13px;font-weight:600;color:var(--text);min-width:88px;text-align:center;letter-spacing:.2px;}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.summary-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 6px 9px;text-align:center;overflow:hidden;}
.summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--bar,var(--border-strong));opacity:.85;}
.summary-card:nth-child(1){--bar:var(--green);}
.summary-card:nth-child(2){--bar:var(--red);}
.summary-card:nth-child(3){--bar:var(--yellow);}
.summary-card:nth-child(4){--bar:var(--accent);}
.s-label{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:600;}
.s-val{font-size:12.5px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:-.2px;}
.green{color:var(--green);}
.red{color:var(--red);}
.yellow{color:var(--yellow);}
.gray{color:var(--text2);}

/* ── Verse ── */
.verse{position:relative;padding:14px 16px 14px 19px;margin:14px 16px 6px;background:linear-gradient(135deg,rgba(217,179,106,.07),rgba(217,179,106,.02));border:1px solid rgba(217,179,106,.18);border-radius:12px;}
.verse::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--gold),transparent);}
.verse-text{font-family:'Source Serif 4',Georgia,serif;font-size:12.5px;font-style:italic;color:var(--text2);line-height:1.65;margin-bottom:6px;}
.verse-ref{font-size:9px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;}

/* ── Bottom Nav ── */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(12,14,18,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:var(--safe-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 8px;cursor:pointer;border:none;background:none;color:var(--text3);font-family:'Inter',sans-serif;font-size:9px;font-weight:500;gap:5px;min-height:var(--nav-h);transition:color .2s;position:relative;letter-spacing:.2px;}
.nav-btn svg{width:20px;height:20px;transition:stroke .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active::before{content:'';position:absolute;top:2px;width:16px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:12px 16px calc(var(--nav-h) + var(--safe-bottom) + 16px);-webkit-overflow-scrolling:touch;}

/* ── Sections ── */
.section{display:none;}
.section.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.sec-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.8px;margin:18px 0 10px;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}

/* ── Items ── */
.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;position:relative;transition:border-color .15s;}
.item.paid,.item.received{border-color:rgba(52,211,153,.22);}
.item.unpaid{border-color:rgba(251,113,133,.2);}
.item.awaiting{border-color:rgba(251,191,36,.2);}
.item-main{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-left{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;}
.status-dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--text3);}
.item.paid .status-dot,.item.received .status-dot{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,.5);}
.item.unpaid .status-dot{background:var(--red);}
.item.awaiting .status-dot{background:var(--yellow);}
.item-desc{font-weight:500;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:.1px;}
.item-right{text-align:right;margin-left:8px;flex-shrink:0;}
.item-val{font-weight:600;font-size:14.5px;color:var(--text);font-family:'JetBrains Mono',monospace;}
.tag{border-radius:20px;padding:3px 9px;font-size:9.5px;font-weight:600;display:inline-block;margin-top:5px;letter-spacing:.4px;text-transform:uppercase;border:1px solid transparent;}
.tag-paid,.tag-received{background:rgba(52,211,153,.1);color:var(--green);border-color:rgba(52,211,153,.25);}
.tag-unpaid{background:rgba(251,113,133,.1);color:var(--red);border-color:rgba(251,113,133,.25);}
.tag-awaiting{background:rgba(251,191,36,.1);color:var(--yellow);border-color:rgba(251,191,36,.25);}
.item-actions{display:flex;gap:7px;margin-top:10px;}
.btn{border:1px solid var(--border-strong);background:transparent;color:var(--text2);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.btn:active{background:var(--surface2);}
.btn-primary{background:var(--accent-dim);color:var(--accent);border-color:rgba(94,234,212,.35);flex:3;font-weight:600;}
.btn-icon{flex:1;padding:8px 6px;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-full{width:100%;margin-top:10px;padding:12px;font-size:14px;}
.btn-danger{border-color:rgba(251,113,133,.35);color:var(--red);}
.btn-success{border-color:rgba(94,234,212,.35);color:var(--accent);}

/* ── Progress bar ── */
.prog-bg{background:var(--border);border-radius:4px;height:3px;overflow:hidden;margin:10px 0 5px;}
.prog-fill{background:var(--text3);height:100%;border-radius:4px;transition:width .5s ease;}
.prog-fill.green{background:linear-gradient(90deg,var(--accent),var(--green));box-shadow:0 0 8px var(--accent-glow);}

/* ── Forms ── */
.form-overlay{position:fixed;inset:0;background:rgba(3,4,6,.75);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.form-sheet{background:var(--bg-elev);border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;padding:22px 18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding-bottom:calc(22px + var(--safe-bottom));}
.form-title{font-size:16px;font-weight:600;margin-bottom:18px;letter-spacing:.2px;}
.form-group{margin-bottom:13px;}
.form-label{font-size:11px;color:var(--text3);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.form-input option{background:var(--surface2);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-actions{display:flex;gap:8px;margin-top:18px;}
.form-check{display:flex;align-items:center;gap:8px;cursor:pointer;}
.form-check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
.form-check span{font-size:14px;color:var(--text2);}

/* ── Confirm ── */
.confirm-bar{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3);border-radius:10px;padding:11px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.confirm-bar p{font-size:13px;color:var(--red);}
.confirm-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── Empty ── */
.empty{text-align:center;color:var(--text3);padding:36px 0;font-size:13px;letter-spacing:.2px;}

/* ── Parcelas progress ── */
.parc-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.parc-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-top:6px;}

/* ── Resumo ── */
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.hist-row:last-child{border-bottom:none;}
.cat-row{display:flex;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);gap:12px;}
.cat-row:last-child{border-bottom:none;}
.cat-info{flex:1;}
.cat-name{font-size:13px;font-weight:400;color:var(--text2);}
.cat-num{text-align:right;min-width:90px;}
.cat-val{font-weight:600;font-size:13px;font-family:'JetBrains Mono',monospace;}
.cat-pct{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;}

/* ── Saving goal ── */
.big-val{font-size:24px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px;}

/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translate(-50%,4px);background:var(--bg-elev);border:1px solid var(--border-strong);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-row">
      <div class="app-title"><span class="mark"></span>Meu Dinheiro</div>
      <button id="btn-settings" onclick="openSettings()" style="font-size:15px;background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:9px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">⚙</button>
    </div>
    <div class="month-nav-row">
      <div class="month-nav">
        <button id="prev-month">‹</button>
        <span class="month-label" id="month-label">—</span>
        <button id="next-month">›</button>
      </div>
      <span id="sync-indicator"></span>
    </div>
    <div class="summary-row">
      <div class="summary-card"><div class="s-label">Receita</div><div class="s-val green" id="s-rec">—</div></div>
      <div class="summary-card"><div class="s-label">Débitos</div><div class="s-val red" id="s-deb">—</div></div>
      <div class="summary-card"><div class="s-label">A pagar</div><div class="s-val red" id="s-pend">—</div></div>
      <div class="summary-card"><div class="s-label">Disponível</div><div class="s-val" id="s-disp">—</div></div>
    </div>
  </div>

  <div id="content">
    <!-- Verse -->
    <div class="verse" id="verse-box"></div>

    <!-- GASTOS -->
    <div class="section active" id="sec-gastos">
      <div class="row-between">
        <div class="sec-title" style="margin:0;">Gastos variáveis</div>
        <button class="btn btn-sm btn-success" onclick="openForm('gasto')">+ Novo</button>
      </div>
      <div id="list-gastos"></div>
    </div>

    <!-- FIXAS -->
    <div class="section" id="sec-fixas">
      <div class="row-between">
        <div class="sec-title" style="margin:0;">Contas fixas</div>
        <button class="btn btn-sm btn-success" onclick="openForm('fixa')">+ Nova</button>
      </div>
      <div id="total-fixas" style="font-size:12px;color:var(--text2);margin-bottom:10px;"></div>
      <div id="list-fixas"></div>
    </div>

    <!-- RECEITA -->
    <div class="section" id="sec-receita">
      <div class="row-between">
        <div class="sec-title" style="margin:0;">Receitas</div>
        <button class="btn btn-sm btn-success" onclick="openForm('receita')">+ Nova</button>
      </div>
      <div id="receita-summary" class="card" style="margin-bottom:10px;display:none;"></div>
      <div id="list-receita"></div>
    </div>

    <!-- PARCELAS -->
    <div class="section" id="sec-parcelas">
      <div class="row-between">
        <div class="sec-title" style="margin:0;">Parcelas ativas</div>
        <button class="btn btn-sm btn-success" onclick="openForm('gasto')">+ Nova</button>
      </div>
      <div id="list-parcelas"></div>
    </div>

    <!-- POUPAR -->
    <div class="section" id="sec-poupar">
      <div id="poupanca-card"></div>
      <div class="row-between">
        <div class="sec-title" style="margin:0;">Depósitos</div>
        <button class="btn btn-sm btn-success" onclick="openForm('deposito')">+ Novo</button>
      </div>
      <div id="list-depositos"></div>
      <div class="sec-title">Sobra por mês (últimos 6)</div>
      <div class="card" id="sobra-meses"></div>
    </div>

    <!-- RESUMO -->
    <div class="section" id="sec-resumo">
      <div class="sec-title">Por categoria</div>
      <div class="card" id="cat-chart"></div>
      <div class="sec-title">Histórico (últimos 6 meses)</div>
      <div class="card" id="historico"></div>
      <div class="sec-title">Template de fixas</div>
      <div class="card" id="template-fixas"></div>
    </div>
  </div>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-sec="gastos" onclick="setSection('gastos',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Gastos
    </button>
    <button class="nav-btn" data-sec="fixas" onclick="setSection('fixas',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>Fixas
    </button>
    <button class="nav-btn" data-sec="receita" onclick="setSection('receita',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6 13.5 15.5l-5-5L1 18"/><path d="M17 6h6v6"/></svg>Receita
    </button>
    <button class="nav-btn" data-sec="parcelas" onclick="setSection('parcelas',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 12V10a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v2a4 4 0 0 1-4 4H3"/></svg>Parcelas
    </button>
    <button class="nav-btn" data-sec="poupar" onclick="setSection('poupar',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Poupar
    </button>
    <button class="nav-btn" data-sec="resumo" onclick="setSection('resumo',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Resumo
    </button>
  </nav>
</div>

<!-- Form overlay -->
<div class="form-overlay" id="form-overlay" style="display:none;" onclick="if(event.target===this)closeForm()">
  <div class="form-sheet" id="form-sheet"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const MESES_PT={
  '01':'Jan','02':'Fev','03':'Mar','04':'Abr','05':'Mai','06':'Jun',
  '07':'Jul','08':'Ago','09':'Set','10':'Out','11':'Nov','12':'Dez'
};
const MESES_FULL={
  '01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho',
  '07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'
};
const CATS=['💳 Cartão','🏦 Banco/Financ.','🏠 Moradia','🚗 Carro','💊 Saúde',
  '💪 Academia/Esporte','⚖️ Profissional','📱 Serviços','🛡️ Seguro','🛒 Compras',
  '💄 Beleza','🎾 Lazer','💰 Poupança','🎯 Outros'];
const CATS_REC=['⚖️ Honorários','💼 Salário','🏠 Aluguel recebido','🤝 Acordo/Êxito',
  '💰 Reembolso','🎁 Presente','📈 Investimento','🎯 Outros'];

const VERSICULO=[
  ['Provérbios 21:20','Na casa do sábio há precioso tesouro e azeite, mas o homem tolo os desperdiça.'],
  ['Provérbios 13:11','A riqueza obtida às pressas diminui, mas quem a ajunta pouco a pouco a aumenta.'],
  ['Lucas 14:28','Pois qual de vós, desejando edificar uma torre, não se assenta primeiro e calcula a despesa?'],
  ['Provérbios 22:7','O rico domina os pobres, e o devedor é servo do credor.'],
  ['Provérbios 3:9-10','Honra ao Senhor com os teus bens e com as primícias de toda a tua renda.'],
  ['Filipenses 4:19','O meu Deus, segundo as suas riquezas em glória, suprirá todas as vossas necessidades.'],
  ['Mateus 6:33','Buscai, pois, em primeiro lugar o reino de Deus e a sua justiça.'],
  ['Eclesiastes 5:10','Quem ama o dinheiro nunca se satisfaz com dinheiro.'],
  ['Provérbios 6:6-8','Vai ter com a formiga, ó preguiçoso, considera os seus caminhos e sê sábio.'],
  ['I Timóteo 6:6','A piedade com contentamento é grande ganho.'],

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(v){
  const s=Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const [i,d]=s.split('.');
  return 'R$ '+(v<0?'-':'')+i+','+(d||'00');
}
function nomeMes(key){
  const[y,m]=key.split('-');
  return MESES_FULL[m]+'/'+y;
}
function nomeMesCurto(key){
  if(!key||!key.includes('-'))return '';
  const[y,m]=key.split('-');
  return MESES_PT[m]+'/'+y;
}
function proxMes(key){
  let[y,m]=key.split('-').map(Number);
  m++;if(m>12){m=1;y++;}
  return y+'-'+String(m).padStart(2,'0');
}
function prevMes(key){
  let[y,m]=key.split('-').map(Number);
  m--;if(m<1){m=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}
function parcelaNum(ps){
  if(!ps||!ps.includes('/'))return null;
  const[a,t]=ps.split('/');
  const ai=parseInt(a.replace(/\D/g,'')),ti=parseInt(t.replace(/\D/g,''));
  if(isNaN(ai)||isNaN(ti))return null;
  return[ai,ti];
}
function versiculoDia(){
  const d=new Date();
  const dy=Math.floor((d-new Date(d.getFullYear(),0,0))/(1000*60*60*24));
  return VERSICULO[dy%VERSICULO.length];
}

// STORAGE / SYNC (API própria em /api, Postgres)
// ═══════════════════════════════════════════
const PENDING_KEY='meu-dinheiro-pending-v1';
const CACHE_KEY='meu-dinheiro-cache-v1';

let versions={config:null,meses:{}};
let pending={config:null,meses:{}};
let flushing=false;
let retryTimer=null;

function setSyncStatus(msg,color='var(--text3)'){
  const el=document.getElementById('sync-indicator');
  if(el){el.textContent=msg;el.style.color=color;}
}

function configSnapshot(){
  return{saldo_inicial:data.saldo_inicial,template_fixas:data.template_fixas,poupanca:data.poupanca};
}
function hasPending(){return pending.config!=null||Object.keys(pending.meses).length>0;}
function persistPendingLocal(){localStorage.setItem(PENDING_KEY,JSON.stringify(pending));}
function restorePendingLocal(){
  try{const s=localStorage.getItem(PENDING_KEY);if(s)pending=JSON.parse(s);}
  catch(e){pending={config:null,meses:{}};}
}
function persistCacheLocal(){localStorage.setItem(CACHE_KEY,JSON.stringify({data,versions}));}
function restoreCacheLocal(){
  try{
    const s=localStorage.getItem(CACHE_KEY);
    if(s){const c=JSON.parse(s);data=c.data;versions=c.versions||{config:null,meses:{}};return true;}
  }catch(e){}
  return false;
}

// Toda mutação chama isto com exatamente as chaves que tocou — sem debounce,
// tenta salvar na hora e mantém a mudança numa fila local até confirmar.
function queuePersist(patch){
  if(patch.config)pending.config=patch.config;
  if(patch.meses)Object.assign(pending.meses,patch.meses);
  persistPendingLocal();
  persistCacheLocal();
  flush();
}

function buildSaveBody(p){
  const body={};
  if(p.config)body.config={dados:p.config,expectedVersion:versions.config};
  const mesKeys=Object.keys(p.meses||{});
  if(mesKeys.length){
    body.meses={};
    for(const mk of mesKeys)body.meses[mk]={dados:p.meses[mk],expectedVersion:versions.meses[mk]??null};
  }
  return body;
}

function reconcileConflicts(conflicts){
  if(conflicts.config){
    data.saldo_inicial=conflicts.config.dados.saldo_inicial;
    data.template_fixas=conflicts.config.dados.template_fixas;
    data.poupanca=conflicts.config.dados.poupanca;
    versions.config=conflicts.config.version;
    pending.config=null;
  }
  if(conflicts.meses){
    for(const mk of Object.keys(conflicts.meses)){
      data.meses[mk]=conflicts.meses[mk].dados;
      versions.meses[mk]=conflicts.meses[mk].version;
      delete pending.meses[mk];
    }
  }
  persistPendingLocal();
  persistCacheLocal();
  render();
  showToast('Alguns dados foram atualizados em outro dispositivo');
}

function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(()=>flush(),5000);
}

// useBeacon=true: usado ao esconder/fechar a aba — dispara via sendBeacon
// (funciona mesmo durante o unload) e não espera confirmação; a fila local
// só é limpa quando o servidor confirmar (via um flush normal posterior).
async function flush(useBeacon){
  if(!hasPending())return true;
  if(useBeacon){
    const body=buildSaveBody(pending);
    navigator.sendBeacon('/api/save',new Blob([JSON.stringify(body)],{type:'application/json'}));
    return true;
  }
  if(flushing)return false;
  flushing=true;
  const toSend={config:pending.config,meses:{...pending.meses}};
  const body=buildSaveBody(toSend);
  try{
    setSyncStatus('↻ salvando…');
    const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true});
    if(r.ok){
      const{versions:v}=await r.json();
      if(v.config!==undefined)versions.config=v.config;
      Object.assign(versions.meses,v.meses||{});
      if(toSend.config&&pending.config===toSend.config)pending.config=null;
      for(const mk of Object.keys(toSend.meses))if(pending.meses[mk]===toSend.meses[mk])delete pending.meses[mk];
      persistPendingLocal();
      persistCacheLocal();
      setSyncStatus('✓ salvo','var(--green)');
      setTimeout(()=>setSyncStatus(''),2000);
      flushing=false;
      if(hasPending())flush();
      return true;
    }
    if(r.status===409){
      const{conflicts}=await r.json();
      flushing=false;
      reconcileConflicts(conflicts);
      return false;
    }
    throw new Error('save failed '+r.status);
  }catch(e){
    console.warn('flush falhou',e);
    setSyncStatus('⚠ sem internet — vai tentar de novo','var(--yellow)');
    flushing=false;
    scheduleRetry();
    return false;
  }
}

window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush(true);});
window.addEventListener('pagehide',()=>flush(true));

async function recarregarAgora(){
  await loadData();
  const novos=garantirMeses();
  if(novos.length){
    const patch={meses:{}};
    for(const mk of novos)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }
  render();
}

// A nuvem é a fonte da verdade, mas só depois de tentar escoar qualquer
// alteração pendente feita localmente — nunca sobrescreve às cegas.
async function loadData(){
  restorePendingLocal();
  const hadCache=restoreCacheLocal();
  if(hasPending()){
    if(hadCache)render();
    const ok=await flush();
    if(!ok){
      setSyncStatus('⚠ alterações não sincronizadas ainda','var(--yellow)');
      return;
    }
  }
  try{
    setSyncStatus('↻ sincronizando…');
    const r=await fetch('/api/data?t='+Date.now());
    if(!r.ok)throw new Error('fetch failed');
    const cloud=await r.json();
    data={saldo_inicial:cloud.saldo_inicial,template_fixas:cloud.template_fixas,poupanca:cloud.poupanca,meses:cloud.meses};
    versions=cloud._versions;
    persistCacheLocal();
    setSyncStatus('✓ atualizado','var(--green)');
    setTimeout(()=>setSyncStatus(''),2000);
  }catch(e){
    console.warn('load falhou',e);
    if(!hadCache){
      data=JSON.parse(JSON.stringify(INITIAL_DATA));
      versions={config:null,meses:{}};
    }
    setSyncStatus('sem sync — usando dados salvos localmente','var(--text3)');
  }
}

function garantirMeses(){
  const alvo='2026-12';
  let chaves=Object.keys(data.meses).sort();
  if(!chaves.length)return[];
  let ultima=chaves[chaves.length-1];
  let cur=proxMes(ultima);
  const novos=[];
  while(cur<=alvo){
    const ant=Object.keys(data.meses).filter(k=>k<cur).sort().pop();
    criarMesNovo(cur,ant);
    novos.push(cur);
    cur=proxMes(cur);
  }
  return novos;
}
function criarMesNovo(novoKey,antKey){
  const ant=data.meses[antKey];
  const parcelas=[];
  for(const l of (ant.lancamentos||[])){
    const pn=parcelaNum(l.parcela);
    if(!pn)continue;
    const[a,t]=pn;
    if(a<t){
      parcelas.push({id:uid(),data:l.data||1,descricao:l.descricao,valor:l.valor,
        parcela:`${a+1}/${t}`,categoria:l.categoria||'🎯 Outros',pago:false,obs:l.obs||''});
    }
  }
  data.meses[novoKey]={
    receitas:[],meta_poupanca:ant.meta_poupanca||0,
    lancamentos:parcelas,
    fixas:(data.template_fixas||[]).map(t=>({id:uid(),descricao:t.descricao,valor:t.valor,categoria:t.categoria,pago:false}))
  };
}

function getMesData(){return data.meses[currentMes]||{receitas:[],lancamentos:[],fixas:[],meta_poupanca:0};}
function totalFixasMes(mv){return (mv.fixas||[]).reduce((s,f)=>s+f.valor,0);}
function totalFixasPagoMes(mv){return (mv.fixas||[]).filter(f=>f.pago).reduce((s,f)=>s+f.valor,0);}
function totalRec(){return getMesData().receitas.reduce((s,r)=>s+(r.recebido?r.valor:0),0);}
function totalDeb(){const mv=getMesData();return mv.lancamentos.reduce((s,l)=>s+l.valor,0)+totalFixasMes(mv);}
function totalPago(){const mv=getMesData();return mv.lancamentos.filter(l=>l.pago).reduce((s,l)=>s+l.valor,0)+totalFixasPagoMes(mv);}
function totalPend(){return totalDeb()-totalPago();}
function disponivel(){return totalRec()-totalPago();}

// ═══════════════════════════════════════════
// SECTION NAV
// ═══════════════════════════════════════════
function setSection(sec,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+sec).classList.add('active');
  btn.classList.add('active');
  currentSection=sec;
  renderSection(sec);
  document.getElementById('content').scrollTop=0;
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render(){
  const keys=Object.keys(data.meses).sort();
  if(!keys.length)return;
  if(!currentMes||!keys.includes(currentMes)){
    const todayKey=new Date().toISOString().slice(0,7);
    if(keys.includes(todayKey)){
      currentMes=todayKey;
    }else{
      let def=keys[keys.length-1];
      for(const k of keys){if(k>=todayKey){def=k;break;}}
      currentMes=def;
    }
  }
  renderHeader();
  renderVerse();
  renderSection(currentSection);
}

function renderHeader(){
  document.getElementById('month-label').textContent=nomeMesCurto(currentMes);
  const disp=disponivel();
  const dispCol=disp>=0?'green':'red';
  document.getElementById('s-rec').textContent=fmt(totalRec());
  document.getElementById('s-deb').textContent=fmt(totalDeb());
  document.getElementById('s-pend').textContent=fmt(totalPend());
  const sd=document.getElementById('s-disp');
  sd.textContent=fmt(disp);
  sd.className='s-val '+dispCol;
}

function renderVerse(){
  const[ref,txt]=versiculoDia();
  document.getElementById('verse-box').innerHTML=
    `<div class="verse-text">"${esc(txt)}"</div><div class="verse-ref">${esc(ref)}</div>`;
}

function renderSection(sec){
  if(sec==='gastos') renderGastos();
  else if(sec==='fixas') renderFixas();
  else if(sec==='receita') renderReceita();
  else if(sec==='parcelas') renderParcelas();
  else if(sec==='poupar') renderPoupar();
  else if(sec==='resumo') renderResumo();
}

// ──────────────────────────────────────────
// GASTOS
// ──────────────────────────────────────────
function renderGastos(){
  const mes=getMesData();
  const lanc=mes.lancamentos||[];
  const sorted=[...lanc].sort((a,b)=>(a.pago?1:-1)-(b.pago?1:-1)||(a.data||0)-(b.data||0));
  let html='';
  if(!sorted.length){html='<div class="empty">Nenhum gasto registrado.</div>';}
  for(const it of sorted){
    const sub=[it.data?`Dia ${it.data}`:'',it.parcela,it.categoria,it.obs].filter(Boolean).join(' · ');
    const cls=it.pago?'paid':'unpaid';
    const tagCls=it.pago?'tag-paid':'tag-unpaid';
    const tagTxt=it.pago?'pago':'pendente';
    const lbl=it.pago?'↩ Desfazer':'✓ Pagar';
    html+=`<div class="item ${cls}" id="item-g-${it.id}">
      <div class="item-main">
        <div class="item-left">
          <div class="item-desc">${esc(it.descricao)}</div>
          <div class="item-sub">${esc(sub)}</div>
        </div>
        <div class="item-right">
          <div class="item-val">${fmt(it.valor)}</div>
          <span class="tag ${tagCls}">${tagTxt}</span>
        </div>
      </div>
      <div class="item-actions">
        <button class="btn btn-primary" onclick="togglePago('lanc','${it.id}')">${lbl}</button>
        <button class="btn btn-icon" onclick="openEditForm('gasto','${it.id}')">✏</button>
        <button class="btn btn-icon btn-danger" onclick="confirmDelete('lanc','${it.id}','${esc(it.descricao)}')">✕</button>
      </div>
      <div id="confirm-g-${it.id}"></div>
    </div>`;
  }
  document.getElementById('list-gastos').innerHTML=html;
}

// ──────────────────────────────────────────
// FIXAS

  const mes=getMesData();

    html+=`<div class="item" id="item-f-${it.id}">
      <div class="item-main">
        <div class="item-left">
          <div class="item-desc">${esc(it.descricao)}</div>
          <div class="item-sub">${esc(it.categoria||'')}</div>
        </div>
        <div class="item-right">
          <div class="item-val">${fmt(it.valor)}</div>

// ──────────────────────────────────────────
// RECEITA
// ──────────────────────────────────────────
function renderReceita(){
  const mes=getMesData();
  const recs=[...(mes.receitas||[])].sort((a,b)=>(a.data||0)-(b.data||0));
  const totR=recs.reduce((s,r)=>s+r.valor,0);
  const recebido=recs.filter(r=>r.recebido).reduce((s,r)=>s+r.valor,0);
  const aguard=totR-recebido;
  const saldo=totalRec()-totalDeb();
  const saldoCor=saldo>=0?'green':'red';
  const sumEl=document.getElementById('receita-summary');
  if(recs.length){
    sumEl.style.display='block';
    sumEl.innerHTML=`
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
        <div><div class="s-label">Total receita</div><div class="s-val green" style="font-size:16px;">${fmt(totR)}</div></div>
        <div style="text-align:right;"><div class="s-label">Saldo projetado</div><div class="s-val ${saldoCor}" style="font-size:16px;">${fmt(saldo)}</div></div>
      </div>
      <div style="display:flex;gap:16px;font-size:12px;">
        <span style="color:var(--green);">Recebido: <b>${fmt(recebido)}</b></span>
        <span style="color:var(--yellow);">Aguardando: <b>${fmt(aguard)}</b></span>
      </div>`;
  }else{sumEl.style.display='none';}
  let html='';
  if(!recs.length){html='<div class="empty">Nenhuma receita registrada.</div>';}
  for(const it of recs){
    const sub=[it.data?`Dia ${it.data}`:'',it.categoria,it.obs].filter(Boolean).join(' · ');
    const cls=it.recebido?'received':'awaiting';
    const tagCls=it.recebido?'tag-received':'tag-awaiting';
    const tagTxt=it.recebido?'recebido':'aguardando';
    const lbl=it.recebido?'↩ Desfazer':'✓ Receber';
    html+=`<div class="item ${cls}" id="item-r-${it.id}">
      <div class="item-main">
        <div class="item-left">
          <div class="item-desc">${esc(it.descricao)}</div>
          <div class="item-sub">${esc(sub)}</div>
        </div>
        <div class="item-right">
          <div class="item-val green">${fmt(it.valor)}</div>
          <span class="tag ${tagCls}">${tagTxt}</span>
        </div>
      </div>
      <div class="item-actions">
        <button class="btn btn-primary" onclick="togglePago('receita','${it.id}')">${lbl}</button>
        <button class="btn btn-icon" onclick="openEditForm('receita','${it.id}')">✏</button>
        <button class="btn btn-icon btn-danger" onclick="confirmDelete('receita','${it.id}','${esc(it.descricao)}')">✕</button>
      </div>
      <div id="confirm-r-${it.id}"></div>
    </div>`;
  }
  document.getElementById('list-receita').innerHTML=html;
}

// ──────────────────────────────────────────
// PARCELAS
// ──────────────────────────────────────────
function renderParcelas(){
  const parcelasMap={};
  const allKeys=Object.keys(data.meses).sort();
  for(const mk of allKeys){
    if(mk>currentMes)break;
    for(const l of (data.meses[mk].lancamentos||[])){
      const pn=parcelaNum(l.parcela);
      if(!pn)continue;
      const[a,t]=pn;
      const key=l.descricao;
      parcelasMap[key]={atual:a,total:t,valor:l.valor,cat:l.categoria||'',obs:l.obs||'',mesKey:mk,id:l.id};
    }
  }
  const entries=Object.entries(parcelasMap).sort((a,b)=>a[0].localeCompare(b[0]));
  let html='';
  if(!entries.length){html='<div class="empty">Nenhuma parcela registrada.</div>';}
  for(const[desc,info] of entries){
    const{atual:a,total:t,valor,cat,mesKey,id}=info;
    const restam=t-a;
    const pct=(a/t*100).toFixed(0);
    const valRest=restam*valor;
    const faltaTxt=restam>0?`Falta ${fmt(valRest)} (${restam}x)`:'Quitada';
    const faltaCor=restam>0?'red':'green';
    html+=`<div class="item" id="item-p-${id}">
      <div class="parc-header">
        <div class="item-desc">${esc(desc)}</div>
        <div class="item-sub">${a}/${t} parcelas</div>
      </div>
      <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;"></div></div>
      <div class="parc-footer">
        <div style="font-size:11px;color:var(--text3);">${esc(cat)} · ${fmt(valor)}/mês</div>
        <div style="font-size:12px;font-weight:700;" class="${faltaCor}">${faltaTxt}</div>
      </div>
      <div class="item-actions">
        <button class="btn btn-primary" onclick="openEditParc('${id}','${esc(desc)}')">✏ Editar</button>
        <button class="btn btn-icon btn-danger" onclick="confirmDeleteParc('${id}','${esc(desc)}','${mesKey}')">✕</button>
      </div>
      <div id="confirm-p-${id}"></div>
    </div>`;
  }
  document.getElementById('list-parcelas').innerHTML=html;
}

// ──────────────────────────────────────────
// POUPAR
// ──────────────────────────────────────────
function renderPoupar(){
  const p=data.poupanca||{objetivo:'',meta_total:0,depositos:[]};
  const deps=p.depositos||[];
  const meta=p.meta_total||0;
  const obj=p.objetivo||'Sem objetivo definido';

  // Lançamentos com categoria Poupança marcados como pagos
  const lancPoupa=[];
  for(const mk of Object.keys(data.meses).sort()){
    for(const l of (data.meses[mk].lancamentos||[])){
      if(l.categoria==='💰 Poupança'&&l.pago){
        lancPoupa.push({mes:mk,valor:l.valor,descricao:l.descricao||'Poupança',data:l.data||1});
      }
    }
  }
  const totalLanc=lancPoupa.reduce((s,l)=>s+l.valor,0);
  const totalDeps=deps.reduce((s,d)=>s+d.valor,0);
  const totalPoupado=totalDeps+totalLanc;
  const pct=meta>0?Math.min(totalPoupado/meta*100,100):0;

  document.getElementById('poupanca-card').innerHTML=`
    <div class="card">
      <div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Objetivo</div>
      <div style="font-weight:700;font-size:15px;margin-bottom:12px;">${esc(obj)}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;">
        <div><div class="s-label">Total poupado</div><div class="big-val green">${fmt(totalPoupado)}</div></div>
        <div style="text-align:right;"><div class="s-label">Meta</div><div style="font-size:16px;font-weight:700;color:var(--text2);">${meta>0?fmt(meta):'—'}</div></div>
      </div>
      <div class="prog-bg"><div class="prog-fill green" style="width:${pct.toFixed(0)}%;"></div></div>
      <div style="font-size:11px;color:var(--text3);text-align:right;margin-top:4px;">${pct.toFixed(0)}% da meta</div>
      <button class="btn btn-full" onclick="openForm('poupanca-cfg')">Editar objetivo e meta</button>
    </div>`;

  let html='';

  // Contribuições automáticas via gastos
  if(lancPoupa.length){
    html+=`<div class="sec-title">Contribuições via Gastos</div>`;
    for(const lp of [...lancPoupa].sort((a,b)=>b.mes.localeCompare(a.mes))){
      html+=`<div class="item" style="border-left:3px solid var(--green);background:#1A2E1A;">
        <div class="item-main">
          <div class="item-left">
            <div class="item-desc">${esc(lp.descricao)}</div>
            <div class="item-sub">${nomeMesCurto(lp.mes)} · Dia ${lp.data} · gasto pago</div>
          </div>
          <div class="item-right"><div class="item-val green">+${fmt(lp.valor)}</div></div>
        </div>
      </div>`;
    }
  }

  // Depósitos manuais
  if(deps.length){
    html+=`<div class="sec-title">Depósitos manuais</div>`;
    const deOrdenados=[...deps].sort((a,b)=>b.mes.localeCompare(a.mes));
    for(const dep of deOrdenados){
      const sub=[nomeMesCurto(dep.mes),dep.obs].filter(Boolean).join(' · ');
      html+=`<div class="item received" id="item-dep-${dep.id}">
        <div class="item-main">
          <div class="item-left"><div class="item-desc">Depósito</div><div class="item-sub">${esc(sub)}</div></div>
          <div class="item-right"><div class="item-val green">${fmt(dep.valor)}</div></div>
        </div>
        <div class="item-actions">
          <button class="btn btn-primary" onclick="openEditDep('${dep.id}')">✏ Editar</button>
          <button class="btn btn-icon btn-danger" onclick="confirmDeleteDep('${dep.id}')">✕</button>
        </div>
        <div id="confirm-dep-${dep.id}"></div>
      </div>`;
    }
  }

  if(!lancPoupa.length&&!deps.length){
    html='<div class="empty">Nenhum depósito ainda.</div>';
  }

  document.getElementById('list-depositos').innerHTML=html;

  // Sobra por mês
  const recentKeys=Object.keys(data.meses).sort().slice(-6);
  let sobraHtml='';
  for(const mk of recentKeys){
    const mv=data.meses[mk];
    const mr=( mv.receitas||[]).reduce((s,r)=>s+(r.recebido?r.valor:0),0);
    const mt=( mv.lancamentos||[]).reduce((s,l)=>s+l.valor,0)+totalFixasMes(mv);
    const sd=mr-mt;
    const cor=sd>=0?'green':'red';
    const bold=mk===currentMes?'font-weight:700;':'';
    sobraHtml+=`<div class="hist-row">
      <div style="font-size:13px;${bold}">${nomeMesCurto(mk)}</div>
      <div class="s-val ${cor}">${fmt(sd)}</div>
    </div>`;
  }
  document.getElementById('sobra-meses').innerHTML=sobraHtml||'<div class="empty">Sem dados.</div>';
}

// ──────────────────────────────────────────
// RESUMO
// ──────────────────────────────────────────
function renderResumo(){
  const mes=getMesData();
  const lanc=mes.lancamentos||[];
  const fixas=mes.fixas||[];
  const total=totalDeb();
  // Por categoria
  const cats={};
  for(const l of lanc){const c=l.categoria||'🎯 Outros';cats[c]=(cats[c]||0)+l.valor;}
  for(const f of fixas){const c=f.categoria||'🎯 Outros';cats[c]=(cats[c]||0)+f.valor;}
  const catOrd=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  let catHtml='';
  for(const[c,v] of catOrd){
    if(v<=0)continue;
    const pct=total>0?(v/total*100):0;
    catHtml+=`<div class="cat-row">
      <div class="cat-info">
        <div class="cat-name">${esc(c)}</div>
        <div class="prog-bg"><div class="prog-fill" style="width:${pct.toFixed(0)}%;"></div></div>
      </div>
      <div class="cat-num">
        <div class="cat-val">${fmt(v)}</div>
        <div class="cat-pct">${pct.toFixed(0)}%</div>
      </div>
    </div>`;
  }
  document.getElementById('cat-chart').innerHTML=catHtml||'<div class="empty">Sem gastos.</div>';

  // Histórico
  const histKeys=Object.keys(data.meses).sort().slice(-6);
  let histHtml='';
  for(const mk of histKeys){
    const mv=data.meses[mk];
    const mt=( mv.lancamentos||[]).reduce((s,l)=>s+l.valor,0)+totalFixasMes(mv);
    const mr=( mv.receitas||[]).reduce((s,r)=>s+(r.recebido?r.valor:0),0);
    const sd=mr-mt;
    const cor=sd>=0?'green':'red';
    const bold=mk===currentMes?'font-weight:700;':'color:var(--text2);';
    histHtml+=`<div class="hist-row">
      <div style="font-size:13px;${bold}">${nomeMesCurto(mk)}</div>
      <div style="text-align:right;">
        <div class="s-val red">${fmt(mt)}</div>
        <div style="font-size:11px;" class="${cor}">saldo ${fmt(sd)}</div>
      </div>
    </div>`;
  }
  document.getElementById('historico').innerHTML=histHtml||'<div class="empty">Sem histórico.</div>';

  // Template fixas
  const tpl=data.template_fixas||[];
  let tplHtml=tpl.map(t=>`<div class="hist-row">
    <div style="font-size:13px;color:var(--text2);">${esc(t.descricao)}</div>
    <div style="font-weight:600;">${fmt(t.valor)}</div>
  </div>`).join('');
  tplHtml+=`<button class="btn btn-full" style="margin-top:10px;" onclick="openForm('template')">Editar template</button>`;
  document.getElementById('template-fixas').innerHTML=tplHtml;
}

// ═══════════════════════════════════════════
// TOGGLE PAID / RECEIVED
// ═══════════════════════════════════════════
function togglePago(tipo,id){
  const mes=getMesData();
  if(tipo==='lanc'){
    const it=mes.lancamentos.find(l=>l.id===id);
    if(it){it.pago=!it.pago;}
  }else if(tipo==='receita'){
    const it=mes.receitas.find(r=>r.id===id);
    if(it){it.recebido=!it.recebido;}
  }
  queuePersist({meses:{[currentMes]:mes}});
  renderHeader();
  renderSection(currentSection);
}

// ═══════════════════════════════════════════
// DELETE CONFIRM
// ═══════════════════════════════════════════
function confirmDelete(tipo,id,desc){
  const pfx=tipo==='lanc'?'g':tipo==='fixa'?'f':'r';
  const el=document.getElementById(`confirm-${pfx}-${id}`);
  if(!el)return;
  el.innerHTML=`<div class="confirm-bar">
    <p>Excluir "${esc(desc)}"?</p>
    <div class="confirm-actions">
      <button class="btn btn-sm btn-danger" onclick="doDelete('${tipo}','${id}')">Excluir</button>
      <button class="btn btn-sm" onclick="cancelConfirm('${pfx}','${id}')">Cancelar</button>
    </div>
  </div>`;
}
function cancelConfirm(pfx,id){
  const el=document.getElementById(`confirm-${pfx}-${id}`);
  if(el)el.innerHTML='';
}
function doDelete(tipo,id){
  const mes=getMesData();
  if(tipo==='lanc'){
    mes.lancamentos=mes.lancamentos.filter(l=>l.id!==id);
    queuePersist({meses:{[currentMes]:mes}});
  }else if(tipo==='fixa'){
    const it=mes.fixas.find(f=>f.id===id);
    mes.fixas=mes.fixas.filter(f=>f.id!==id);
    const tocados=it?propagarFixaDelete(it.descricao):[];
    const patch={config:configSnapshot(),meses:{[currentMes]:mes}};
    for(const mk of tocados)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }else if(tipo==='receita'){
    mes.receitas=mes.receitas.filter(r=>r.id!==id);
    queuePersist({meses:{[currentMes]:mes}});
  }
  renderHeader();
  renderSection(currentSection);
  showToast('Item excluído');
}
function confirmDeleteParc(id,desc,mesKey){
  const el=document.getElementById(`confirm-p-${id}`);
  if(!el)return;
  el.innerHTML=`<div class="confirm-bar">
    <p>Excluir parcela "${esc(desc)}"?</p>
    <div class="confirm-actions">
      <button class="btn btn-sm btn-danger" onclick="doDeleteParc('${id}','${mesKey}')">Excluir</button>
      <button class="btn btn-sm" onclick="document.getElementById('confirm-p-${id}').innerHTML=''">Cancelar</button>
    </div>
  </div>`;
}
function doDeleteParc(id,mesKey){
  const mv=data.meses[mesKey];
  if(mv){
    mv.lancamentos=mv.lancamentos.filter(l=>l.id!==id);
    queuePersist({meses:{[mesKey]:mv}});
  }
  renderSection('parcelas');
  showToast('Parcela excluída');
}
function confirmDeleteDep(id){
  const el=document.getElementById(`confirm-dep-${id}`);
  if(!el)return;
  el.innerHTML=`<div class="confirm-bar">
    <p>Excluir depósito?</p>
    <div class="confirm-actions">
      <button class="btn btn-sm btn-danger" onclick="doDeleteDep('${id}')">Excluir</button>
      <button class="btn btn-sm" onclick="document.getElementById('confirm-dep-${id}').innerHTML=''">Cancelar</button>
    </div>
  </div>`;
}
function doDeleteDep(id){
  data.poupanca.depositos=data.poupanca.depositos.filter(d=>d.id!==id);
  queuePersist({config:configSnapshot()});
  renderPoupar();
  showToast('Depósito excluído');
}

// ═══════════════════════════════════════════
// FORMS
// ═══════════════════════════════════════════
function openForm(tipo){
  const sheet=document.getElementById('form-sheet');
  sheet.innerHTML=buildForm(tipo,null);

  let item=null;

  else if(tipo==='receita') item=(mes.receitas||[]).find(r=>r.id===id);

  const sheet=document.getElementById('form-sheet');
  sheet.innerHTML=buildForm(tipo,item);

function openEditParc(id,desc){

  for(const mk of Object.keys(data.meses).sort()){

function openEditDep(id){

function g(id){return document.getElementById(id);}
function gv(id,fallback=''){const e=g(id);return e?e.value.trim():fallback;}
function gn(id){return parseFloat(g(id)?.value||0)||0;}
function gb(id){return g(id)?.checked||false;}

// ═══════════════════════════════════════════
// PROPAGAÇÃO DE FIXAS PARA MESES FUTUROS
// ═══════════════════════════════════════════
function normDesc(s){return (s||'').trim().toLowerCase();}
function futureMonthKeys(){return Object.keys(data.meses).filter(k=>k>currentMes).sort();}

function upsertTemplateFixa(desc,valor,categoria,oldDesc){
  if(!data.template_fixas)data.template_fixas=[];
  const alvo=normDesc(oldDesc||desc);
  const idx=data.template_fixas.findIndex(t=>normDesc(t.descricao)===alvo);
  if(idx>=0)data.template_fixas[idx]={descricao:desc,valor,categoria};
  else data.template_fixas.push({descricao:desc,valor,categoria});
}

function propagarFixaAdd(obj){
  const alvo=normDesc(obj.descricao);
  const tocados=[];
  for(const mk of futureMonthKeys()){
    const mv=data.meses[mk];
    if(!mv.fixas)mv.fixas=[];
    if(mv.fixas.some(f=>normDesc(f.descricao)===alvo))continue;
    mv.fixas.push({id:uid(),descricao:obj.descricao,valor:obj.valor,categoria:obj.categoria,pago:false});
    tocados.push(mk);
  }
  upsertTemplateFixa(obj.descricao,obj.valor,obj.categoria);
  return tocados;
}

function propagarFixaEdit(oldDesc,obj){
  const alvo=normDesc(oldDesc);
  const tocados=[];
  for(const mk of futureMonthKeys()){
    const mv=data.meses[mk];
    const f=(mv.fixas||[]).find(f=>normDesc(f.descricao)===alvo);
    if(f){f.descricao=obj.descricao;f.valor=obj.valor;f.categoria=obj.categoria;tocados.push(mk);}
  }
  upsertTemplateFixa(obj.descricao,obj.valor,obj.categoria,oldDesc);
  return tocados;
}

function propagarFixaDelete(desc){
  const alvo=normDesc(desc);
  const tocados=[];
  for(const mk of futureMonthKeys()){
    const mv=data.meses[mk];
    if(!mv.fixas)continue;
    const antes=mv.fixas.length;
    mv.fixas=mv.fixas.filter(f=>normDesc(f.descricao)!==alvo);
    if(mv.fixas.length!==antes)tocados.push(mk);
  }
  if(data.template_fixas)data.template_fixas=data.template_fixas.filter(t=>normDesc(t.descricao)!==alvo);
  return tocados;
}

// ═══════════════════════════════════════════
// PROPAGAÇÃO DE PARCELAS PARA MESES FUTUROS
// ═══════════════════════════════════════════
function monthsAfter(mesKey){return Object.keys(data.meses).filter(k=>k>mesKey).sort();}

function propagarParcela(mesKey,descricao,aBase,tBase,valor,categoria,dia,obs){
  const alvo=normDesc(descricao);
  const tocados=[];
  let a=aBase;
  for(const mk of monthsAfter(mesKey)){
    const mv=data.meses[mk];
    if(!mv)continue;
    if(!mv.lancamentos)mv.lancamentos=[];
    a++;
    const idx=mv.lancamentos.findIndex(l=>normDesc(l.descricao)===alvo&&parcelaNum(l.parcela));
    if(a>tBase){
      if(idx>=0){mv.lancamentos.splice(idx,1);tocados.push(mk);}
      continue;
    }
    const parcela=`${a}/${tBase}`;
    if(idx>=0){
      const it=mv.lancamentos[idx];
      mv.lancamentos[idx]={...it,descricao,valor,categoria,parcela};
    }else{
      mv.lancamentos.push({id:uid(),data:dia||1,descricao,valor,parcela,categoria,pago:false,obs:obs||''});
    }
    tocados.push(mk);
  }
  return tocados;
}

function submitForm(tipo,editId){
  const mes=getMesData();
  const desc=gv('fi-desc');
  const val=gn('fi-val');
  if(!desc){showToast('Preencha a descrição');return;}
  if(val<=0&&tipo!=='fixa'&&tipo!=='gasto'){showToast('Informe um valor');return;}

  if(tipo==='gasto'){
    const obj={id:editId||uid(),data:parseInt(gv('fi-dia'))||today(),
      descricao:desc,valor:val,parcela:gv('fi-parc'),
      categoria:gv('fi-cat'),pago:gb('fi-pago'),obs:gv('fi-obs')};
    if(editId){const idx=mes.lancamentos.findIndex(l=>l.id===editId);if(idx>=0)mes.lancamentos[idx]=obj;}
    else mes.lancamentos.push(obj);
    const patchGasto={meses:{[currentMes]:mes}};
    const pnGasto=parcelaNum(obj.parcela);
    if(pnGasto){
      const tocados=propagarParcela(currentMes,obj.descricao,pnGasto[0],pnGasto[1],obj.valor,obj.categoria,obj.data,obj.obs);
      for(const mk of tocados)patchGasto.meses[mk]=data.meses[mk];
    }
    queuePersist(patchGasto);
  }else if(tipo==='fixa'){
    const obj={id:editId||uid(),descricao:desc,valor:val,categoria:gv('fi-cat')};
    let tocados=[];
    if(editId){
      const idx=mes.fixas.findIndex(f=>f.id===editId);
      if(idx>=0){
        const oldDesc=mes.fixas[idx].descricao;
        mes.fixas[idx]=obj;
        tocados=propagarFixaEdit(oldDesc,obj);
      }
    }else{
      mes.fixas.push(obj);
      tocados=propagarFixaAdd(obj);
    }
    const patch={config:configSnapshot(),meses:{[currentMes]:mes}};
    for(const mk of tocados)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }else if(tipo==='receita'){
    const obj={id:editId||uid(),data:parseInt(gv('fi-dia'))||today(),
      descricao:desc,valor:val,categoria:gv('fi-cat'),recebido:gb('fi-rec'),obs:gv('fi-obs')};
    if(editId){const idx=mes.receitas.findIndex(r=>r.id===editId);if(idx>=0)mes.receitas[idx]=obj;}
    else mes.receitas.push(obj);
    queuePersist({meses:{[currentMes]:mes}});
  }
  closeForm();renderHeader();renderSection(currentSection);
  showToast(editId?'Salvo!':'Adicionado!');
}

function submitDep(editId){
  const val=gn('fi-val');const mes=gv('fi-mes');
  if(val<=0){showToast('Informe um valor');return;}
  if(!data.poupanca)data.poupanca={objetivo:'',meta_total:0,depositos:[]};
  const obj={id:editId||uid(),mes,valor:val,obs:gv('fi-obs')};
  if(editId){const idx=data.poupanca.depositos.findIndex(d=>d.id===editId);if(idx>=0)data.poupanca.depositos[idx]=obj;}
  else data.poupanca.depositos.push(obj);
  queuePersist({config:configSnapshot()});
  closeForm();renderPoupar();showToast(editId?'Salvo!':'Depósito adicionado!');
}

function submitPoupancaCfg(){
  if(!data.poupanca)data.poupanca={objetivo:'',meta_total:0,depositos:[]};
  data.poupanca.objetivo=gv('fi-obj');
  data.poupanca.meta_total=gn('fi-meta');
  queuePersist({config:configSnapshot()});
  closeForm();renderPoupar();showToast('Objetivo salvo!');
}

function submitParc(id,mesKey){
  const mv=data.meses[mesKey];
  if(!mv)return;
  const it=mv.lancamentos.find(l=>l.id===id);
  if(!it)return;
  it.descricao=gv('fi-desc');
  it.valor=gn('fi-val');
  it.parcela=`${gv('fi-pat')}/${gv('fi-ptot')}`;
  it.categoria=gv('fi-cat');
  it.obs=gv('fi-obs');
  const patchParc={meses:{[mesKey]:mv}};
  const pnParc=parcelaNum(it.parcela);
  if(pnParc){
    const tocados=propagarParcela(mesKey,it.descricao,pnParc[0],pnParc[1],it.valor,it.categoria,it.data,it.obs);
    for(const mk of tocados)patchParc.meses[mk]=data.meses[mk];
  }
  queuePersist(patchParc);
  closeForm();renderParcelas();showToast('Parcela salva!');
}

function submitTemplate(count){
  const tpl=[];
  for(let i=0;i<count;i++){
    const d=gv(`tpl-desc-${i}`);
    const v=parseFloat(g(`tpl-val-${i}`)?.value||0);
    if(d&&v>0) tpl.push({descricao:d,valor:v,categoria:gv(`tpl-cat-${i}`)});
  }
  data.template_fixas=tpl;
  queuePersist({config:configSnapshot()});
  closeForm();renderResumo();showToast('Template salvo!');
}

// ═══════════════════════════════════════════
// MONTH NAVIGATION
// ═══════════════════════════════════════════
document.getElementById('prev-month').onclick=()=>{
  const keys=Object.keys(data.meses).sort();
  const idx=keys.indexOf(currentMes);
  if(idx>0){currentMes=keys[idx-1];render();}
};
document.getElementById('next-month').onclick=()=>{
  const keys=Object.keys(data.meses).sort();
  const idx=keys.indexOf(currentMes);
  if(idx<keys.length-1){currentMes=keys[idx+1];render();}
};

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init(){
  await loadData();
  // Ensure retrocompat fields
  if(!data.poupanca) data.poupanca={objetivo:'',meta_total:0,depositos:[]};
  if(!data.template_fixas) data.template_fixas=[];
  if(!data.saldo_inicial) data.saldo_inicial=0;
  if(!data.meses) data.meses={};
  Object.values(data.meses).forEach(m=>{
    if(!m.receitas) m.receitas=[];
    if(!m.meta_poupanca) m.meta_poupanca=0;
  });
  const novos=garantirMeses();
  if(novos.length){
    const patch={meses:{}};
    for(const mk of novos)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }
  render();
}
init();

// Keyboard: Escape closes form
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();});
