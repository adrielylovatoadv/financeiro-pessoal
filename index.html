<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meu Dinheiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0B0B0C;
  --surface:#151517;
  --card:#1C1C1F;
  --card2:#222226;
  --border:#2B2B2F;
  --border-soft:#232326;
  --primary:#2ECC71;
  --primary-dim:rgba(46,204,113,.14);
  --primary-glow:rgba(46,204,113,.35);
  --danger:#FF5C5C;
  --danger-dim:rgba(255,92,92,.13);
  --warning:#FFB547;
  --warning-dim:rgba(255,181,71,.13);
  --text:#FFFFFF;
  --text2:#9B9BA3;
  --text3:#68686F;
  --gold:#D9B36A;
  --green:#2ECC71;
  --red:#FF5C5C;
  --yellow:#FFB547;
  --accent:#2ECC71;
  --nav-h:64px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius-lg:20px;
  --radius:18px;
  --radius-sm:14px;
  --radius-xs:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --t-fast:180ms;
  --t:240ms;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:15px;overscroll-behavior:none;font-weight:400;-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;}
button,input,select{font-family:inherit;}

/* ── Header ── */
#header{position:relative;background:rgba(11,11,12,.88);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);padding:16px 20px 14px;border-bottom:1px solid var(--border-soft);z-index:10;flex-shrink:0;}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.app-title{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--text);display:flex;align-items:center;gap:9px;white-space:nowrap;flex-shrink:0;}
.app-title .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#1FA157);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#06210F;}
.app-title .mark svg{width:15px;height:15px;stroke-width:2.4;}
#sync-indicator{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;min-width:0;font-weight:500;}
.month-nav{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:11px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease);flex-shrink:0;}
.icon-btn svg{width:16px;height:16px;stroke-width:2;}
.icon-btn:hover{border-color:var(--text3);color:var(--text);}
.icon-btn:active{transform:scale(.94);background:var(--card);}
.month-label{font-size:13px;font-weight:600;color:var(--text);min-width:84px;text-align:center;letter-spacing:.1px;}

/* ── Verse ── */
.verse{position:relative;padding:14px 16px 14px 19px;margin:14px 0 6px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);}
.verse::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--gold),transparent);}
.verse-text{font-family:'Source Serif 4',Georgia,serif;font-size:12.5px;font-style:italic;color:var(--text2);line-height:1.65;margin-bottom:6px;}
.verse-ref{font-size:9px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;}

/* ── Bottom Nav ── */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(17,17,19,.92);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-top:1px solid var(--border-soft);display:flex;z-index:100;padding-bottom:var(--safe-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;border:none;background:none;color:var(--text3);font-size:10px;font-weight:500;gap:5px;min-height:var(--nav-h);transition:color var(--t) var(--ease);position:relative;letter-spacing:.1px;}
.nav-btn svg{width:21px;height:21px;stroke-width:1.8;transition:stroke var(--t) var(--ease),fill var(--t) var(--ease),fill-opacity var(--t) var(--ease),transform var(--t) var(--ease);}
.nav-btn.active{color:var(--primary);font-weight:600;}
.nav-btn.active svg{fill:var(--primary);fill-opacity:.16;transform:translateY(-1px);}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:0 20px calc(var(--nav-h) + var(--safe-bottom) + 20px);-webkit-overflow-scrolling:touch;}

/* ── Sections ── */
.section{display:none;}
.section.active{display:block;animation:fadeIn .3s var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.4px;margin:20px 0 12px;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:10px;}

/* ── Icon chip (categories) ── */
.icon-chip{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text2);}
.icon-chip svg{width:17px;height:17px;stroke-width:1.9;}

/* ── Items ── */
.item{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;margin-bottom:10px;position:relative;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),border-color var(--t-fast) var(--ease);animation:itemIn var(--t) var(--ease);}
@keyframes itemIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.item.leaving{opacity:0;transform:scale(.97);}
.item.paid,.item.received{opacity:.55;}
.item.late{border-color:rgba(255,92,92,.4);}
.item-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.item-left{flex:1;min-width:0;display:flex;align-items:center;gap:12px;}
.item-text{min-width:0;flex:1;}
.item-desc{font-weight:600;font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;}
.item-sub{font-size:12px;color:var(--text3);margin-top:3px;letter-spacing:.1px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-right{text-align:right;margin-left:8px;flex-shrink:0;}
.item-val{font-weight:700;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
.tag{border-radius:8px;padding:3px 8px;font-size:10px;font-weight:600;display:inline-block;margin-top:6px;letter-spacing:.2px;border:1px solid transparent;}
.tag-paid,.tag-received{background:var(--primary-dim);color:var(--primary);}
.tag-unpaid{background:var(--card2);color:var(--text2);}
.tag-awaiting{background:var(--warning-dim);color:var(--warning);}
.tag-hoje{background:var(--warning-dim);color:var(--warning);}
.tag-atrasado{background:var(--danger-dim);color:var(--danger);}
.item-actions{display:flex;gap:8px;margin-top:14px;}

/* ── Group headers (Contas) ── */
.grp-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin:22px 0 10px;}
.grp-title:first-child{margin-top:6px;}
.grp-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);}
.grp-title.st-atrasado .grp-dot{background:var(--danger);}
.grp-title.st-hoje .grp-dot{background:var(--warning);}
.grp-title.st-pendente .grp-dot{background:var(--text3);}
.grp-title.st-pago .grp-dot{background:var(--primary);}
.grp-count{background:var(--card2);color:var(--text2);border-radius:20px;padding:1px 7px;font-size:10px;font-weight:600;letter-spacing:0;text-transform:none;}

/* ── Buttons ── */
.btn{border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:var(--radius-sm);padding:0 14px;height:40px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn svg{width:15px;height:15px;stroke-width:2.1;}
.btn:hover{border-color:var(--text3);}
.btn:active{transform:scale(.96);opacity:.85;}
.btn-primary{background:var(--primary);color:#06210F;border-color:var(--primary);height:48px;border-radius:14px;font-weight:700;flex:3;}
.btn-primary:hover{background:#33D67A;}
.btn-primary.done{background:var(--card2);color:var(--text2);border-color:var(--border);}
.btn-icon{flex:0 0 auto;width:40px;padding:0;}
.btn-sm{height:34px;padding:0 12px;font-size:12.5px;}
.btn-full{width:100%;margin-top:12px;height:48px;border-radius:14px;font-size:14px;}
.btn-danger{border-color:rgba(255,92,92,.3);color:var(--danger);}
.btn-danger:hover{background:var(--danger-dim);}
.btn-success{background:var(--primary);color:#06210F;border-color:var(--primary);font-weight:700;}
.btn-success:hover{background:#33D67A;}

/* ── Progress bar ── */
.prog-bg{background:var(--card2);border-radius:5px;height:5px;overflow:hidden;margin:12px 0 6px;}
.prog-fill{background:var(--text3);height:100%;border-radius:5px;transition:width .6s var(--ease);}
.prog-fill.green{background:var(--primary);}

/* ── Forms ── */
.form-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:overlayIn var(--t) var(--ease);}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.form-sheet{background:var(--surface);border:1px solid var(--border-soft);border-bottom:none;border-radius:24px 24px 0 0;padding:24px 20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding-bottom:calc(24px + var(--safe-bottom));animation:sheetIn var(--t) var(--ease);}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.form-title{font-size:17px;font-weight:700;margin-bottom:20px;letter-spacing:-.2px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;color:var(--text3);margin-bottom:7px;display:block;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.form-input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-xs);padding:12px 13px;font-size:16px;outline:none;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim);}
.form-input option{background:var(--card);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-actions{display:flex;gap:8px;margin-top:20px;}
.form-check{display:flex;align-items:center;gap:9px;cursor:pointer;}
.form-check input{width:19px;height:19px;accent-color:var(--primary);cursor:pointer;}
.form-check span{font-size:14px;color:var(--text2);}

/* ── Search / Filter bar ── */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:0 14px;height:44px;transition:border-color var(--t-fast) var(--ease);}
.search-box:focus-within{border-color:var(--text3);}
.search-box svg{width:16px;height:16px;color:var(--text3);flex-shrink:0;stroke-width:2;}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;height:100%;}
.search-box input::placeholder{color:var(--text3);}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border-soft);color:var(--text2);border-radius:20px;padding:0 14px;height:32px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all var(--t-fast) var(--ease);display:flex;align-items:center;}
.chip.active{background:var(--primary-dim);border-color:rgba(46,204,113,.4);color:var(--primary);}
.chip select{background:none;border:none;color:inherit;font:inherit;font-weight:600;outline:none;cursor:pointer;}
.chip select option{background:var(--card);color:var(--text);}

/* ── Confirm ── */
.confirm-bar{background:var(--danger-dim);border:1px solid rgba(255,92,92,.3);border-radius:var(--radius-xs);padding:12px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;animation:itemIn var(--t-fast) var(--ease);}
.confirm-bar p{font-size:13px;color:var(--danger);font-weight:500;}
.confirm-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── Empty ── */
.empty{text-align:center;color:var(--text3);padding:40px 0;font-size:13px;letter-spacing:.1px;}

/* ── Parcelas progress ── */
.parc-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.parc-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-top:6px;}

/* ── Resumo ── */
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.hist-row:last-child{border-bottom:none;}
.cat-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);gap:13px;}
.cat-row:last-child{border-bottom:none;}
.cat-info{flex:1;min-width:0;}
.cat-name{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:6px;}
.cat-num{text-align:right;min-width:84px;flex-shrink:0;}
.cat-val{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;}
.cat-pct{font-size:10.5px;color:var(--text3);font-variant-numeric:tabular-nums;margin-top:2px;}

/* ── Saving goal ── */
.big-val{font-size:30px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums;}

/* ── Dashboard ── */
.hero-card{background:linear-gradient(160deg,var(--card) 0%,var(--surface) 100%);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:26px 22px;margin:16px 0 14px;position:relative;overflow:hidden;}
.hero-label{font-size:12px;color:var(--text2);font-weight:500;letter-spacing:.1px;margin-bottom:8px;}
.hero-val{font-size:38px;font-weight:700;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;line-height:1.1;}
.indicator-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px;}
.indicator{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:14px 6px;text-align:center;}
.indicator-label{font-size:10.5px;color:var(--text3);font-weight:600;letter-spacing:.3px;margin-bottom:6px;text-transform:uppercase;}
.indicator-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
.mini-stats{display:flex;gap:10px;margin-bottom:16px;}
.mini-stat{flex:1;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;}
.mini-stat span{display:block;font-size:10.5px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;}
.mini-stat b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.preview-row{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:14px 0;border-bottom:1px solid var(--border-soft);}
.preview-row:last-child{border-bottom:none;}
.s-label{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:5px;}
.s-val{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;}

.green{color:var(--primary);}
.red{color:var(--danger);}
.yellow{color:var(--warning);}
.gray{color:var(--text2);}

/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav-h) + 18px);left:50%;transform:translate(-50%,6px);background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:var(--radius-xs);font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-row">
      <div class="app-title"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-6a2 2 0 0 1 0-4h6Z"/></svg></span>Meu Dinheiro</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="month-nav">
          <button class="icon-btn" id="prev-month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="month-label" id="month-label">—</span>
          <button class="icon-btn" id="next-month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <button class="icon-btn" id="btn-settings" onclick="openSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
      </div>
    </div>
    <div id="sync-indicator" style="text-align:right;margin-top:4px;"></div>
  </div>

  <div id="content">
    <!-- Verse -->
    <div class="verse" id="verse-box"></div>

    <!-- DASHBOARD -->
    <div class="section active" id="sec-dashboard">
      <div class="hero-card">
        <div class="hero-label">Saldo disponível</div>
        <div class="hero-val" id="dash-disp">—</div>
      </div>
      <div class="indicator-row">
        <div class="indicator"><div class="indicator-label">Entradas</div><div class="indicator-val green" id="dash-rec">—</div></div>
        <div class="indicator"><div class="indicator-label">Saídas</div><div class="indicator-val red" id="dash-deb">—</div></div>
        <div class="indicator"><div class="indicator-label">Pendentes</div><div class="indicator-val yellow" id="dash-pend">—</div></div>
      </div>
      <div class="sec-title" style="margin-top:24px;">Próximas contas</div>
      <div class="card" id="dash-preview"></div>
    </div>

    <!-- CONTAS -->
    <div class="section" id="sec-contas">
      <div class="row-between">

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(v){
  const s=Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const [i,d]=s.split('.');
  return 'R$ '+(v<0?'-':'')+i+','+(d||'00');
}
function nomeMes(key){
  const[y,m]=key.split('-');
  return MESES_FULL[m]+'/'+y;
}
function nomeMesCurto(key){
  if(!key||!key.includes('-'))return '';
  const[y,m]=key.split('-');
  return MESES_PT[m]+'/'+y;
}
function proxMes(key){
  let[y,m]=key.split('-').map(Number);
  m++;if(m>12){m=1;y++;}
  return y+'-'+String(m).padStart(2,'0');
}
function prevMes(key){
  let[y,m]=key.split('-').map(Number);
  m--;if(m<1){m=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}
function parcelaNum(ps){
  if(!ps||!ps.includes('/'))return null;
  const[a,t]=ps.split('/');
  const ai=parseInt(a.replace(/\D/g,'')),ti=parseInt(t.replace(/\D/g,''));
  if(isNaN(ai)||isNaN(ti))return null;
  return[ai,ti];
}
function versiculoDia(){
  const d=new Date();
  const dy=Math.floor((d-new Date(d.getFullYear(),0,0))/(1000*60*60*24));
  return VERSICULO[dy%VERSICULO.length];
}

function showToast(msg){

}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  return{saldo_inicial:data.saldo_inicial,template_fixas:data.template_fixas,poupanca:data.poupanca};
}
function hasPending(){return pending.config!=null||Object.keys(pending.meses).length>0;}
function persistPendingLocal(){localStorage.setItem(PENDING_KEY,JSON.stringify(pending));}
function restorePendingLocal(){
  try{const s=localStorage.getItem(PENDING_KEY);if(s)pending=JSON.parse(s);}
  catch(e){pending={config:null,meses:{}};}
}
function persistCacheLocal(){localStorage.setItem(CACHE_KEY,JSON.stringify({data,versions}));}
function restoreCacheLocal(){
  try{
    const s=localStorage.getItem(CACHE_KEY);
    if(s){const c=JSON.parse(s);data=c.data;versions=c.versions||{config:null,meses:{}};return true;}
  }catch(e){}
  return false;
}

// Toda mutação chama isto com exatamente as chaves que tocou — sem debounce,
// tenta salvar na hora e mantém a mudança numa fila local até confirmar.
function queuePersist(patch){
  if(patch.config)pending.config=patch.config;
  if(patch.meses)Object.assign(pending.meses,patch.meses);
  persistPendingLocal();
  persistCacheLocal();
  flush();
}

function buildSaveBody(p){
  const body={};
  if(p.config)body.config={dados:p.config,expectedVersion:versions.config};
  const mesKeys=Object.keys(p.meses||{});
  if(mesKeys.length){
    body.meses={};
    for(const mk of mesKeys)body.meses[mk]={dados:p.meses[mk],expectedVersion:versions.meses[mk]??null};
  }
  return body;
}

function reconcileConflicts(conflicts){
  if(conflicts.config){
    data.saldo_inicial=conflicts.config.dados.saldo_inicial;
    data.template_fixas=conflicts.config.dados.template_fixas;
    data.poupanca=conflicts.config.dados.poupanca;
    versions.config=conflicts.config.version;
    pending.config=null;
  }
  if(conflicts.meses){
    for(const mk of Object.keys(conflicts.meses)){
      data.meses[mk]=conflicts.meses[mk].dados;
      versions.meses[mk]=conflicts.meses[mk].version;
      delete pending.meses[mk];
    }
  }
  persistPendingLocal();
  persistCacheLocal();
  render();
  showToast('Alguns dados foram atualizados em outro dispositivo');
}

function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(()=>flush(),5000);
}

// useBeacon=true: usado ao esconder/fechar a aba — dispara via sendBeacon
// (funciona mesmo durante o unload) e não espera confirmação; a fila local
// só é limpa quando o servidor confirmar (via um flush normal posterior).
async function flush(useBeacon){
  if(!hasPending())return true;
  if(useBeacon){
    const body=buildSaveBody(pending);
    navigator.sendBeacon('/api/save',new Blob([JSON.stringify(body)],{type:'application/json'}));
    return true;
  }
  if(flushing)return false;
  flushing=true;
  const toSend={config:pending.config,meses:{...pending.meses}};
  const body=buildSaveBody(toSend);
  try{
    setSyncStatus('↻ salvando…');
    const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true});
    if(r.ok){
      const{versions:v}=await r.json();
      if(v.config!==undefined)versions.config=v.config;
      Object.assign(versions.meses,v.meses||{});
      if(toSend.config&&pending.config===toSend.config)pending.config=null;
      for(const mk of Object.keys(toSend.meses))if(pending.meses[mk]===toSend.meses[mk])delete pending.meses[mk];
      persistPendingLocal();
      persistCacheLocal();
      setSyncStatus('✓ salvo','var(--green)');
      setTimeout(()=>setSyncStatus(''),2000);
      flushing=false;
      if(hasPending())flush();
      return true;
    }
    if(r.status===409){
      const{conflicts}=await r.json();
      flushing=false;
      reconcileConflicts(conflicts);
      return false;
    }
    throw new Error('save failed '+r.status);
  }catch(e){
    console.warn('flush falhou',e);
    setSyncStatus('⚠ sem internet — vai tentar de novo','var(--yellow)');
    flushing=false;
    scheduleRetry();
    return false;
  }
}

window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush(true);});
window.addEventListener('pagehide',()=>flush(true));

async function recarregarAgora(){
  await loadData();
  const novos=garantirMeses();
  if(novos.length){
    const patch={meses:{}};
    for(const mk of novos)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }
  render();
}

// A nuvem é a fonte da verdade, mas só depois de tentar escoar qualquer
// alteração pendente feita localmente — nunca sobrescreve às cegas.
async function loadData(){
  restorePendingLocal();
  const hadCache=restoreCacheLocal();
  if(hasPending()){
    if(hadCache)render();
    const ok=await flush();
    if(!ok){
      setSyncStatus('⚠ alterações não sincronizadas ainda','var(--yellow)');
      return;
    }
  }
  try{
    setSyncStatus('↻ sincronizando…');
    const r=await fetch('/api/data?t='+Date.now());
    if(!r.ok)throw new Error('fetch failed');
    const cloud=await r.json();
    data={saldo_inicial:cloud.saldo_inicial,template_fixas:cloud.template_fixas,poupanca:cloud.poupanca,meses:cloud.meses};
    versions=cloud._versions;
    persistCacheLocal();
    setSyncStatus('✓ atualizado','var(--green)');
    setTimeout(()=>setSyncStatus(''),2000);
  }catch(e){
    console.warn('load falhou',e);
    if(!hadCache){
      data=JSON.parse(JSON.stringify(INITIAL_DATA));
      versions={config:null,meses:{}};
    }
    setSyncStatus('sem sync — usando dados salvos localmente','var(--text3)');
  }
}

// MONTH GENERATION
// ═══════════════════════════════════════════
function garantirMeses(){
  const alvo='2026-12';
  let chaves=Object.keys(data.meses).sort();
  if(!chaves.length)return[];
  let ultima=chaves[chaves.length-1];
  let cur=proxMes(ultima);
  const novos=[];
  while(cur<=alvo){
    const ant=Object.keys(data.meses).filter(k=>k<cur).sort().pop();
    criarMesNovo(cur,ant);
    novos.push(cur);
    cur=proxMes(cur);
  }
  return novos;
}
function criarMesNovo(novoKey,antKey){
  const ant=data.meses[antKey];
  const parcelas=[];
  for(const l of (ant.lancamentos||[])){
    const pn=parcelaNum(l.parcela);
    if(!pn)continue;
    const[a,t]=pn;
    if(a<t){
      parcelas.push({id:uid(),data:l.data||1,descricao:l.descricao,valor:l.valor,
        parcela:`${a+1}/${t}`,categoria:l.categoria||'🎯 Outros',pago:false,obs:l.obs||''});
    }
  }
  data.meses[novoKey]={
    receitas:[],meta_poupanca:ant.meta_poupanca||0,
    lancamentos:parcelas,
    fixas:(data.template_fixas||[]).map(t=>({id:uid(),descricao:t.descricao,valor:t.valor,categoria:t.categoria,pago:false}))
  };
}

// ═══════════════════════════════════════════
// COMPUTE
// ═══════════════════════════════════════════
function getMesData(){return data.meses[currentMes]||{receitas:[],lancamentos:[],fixas:[],meta_poupanca:0};}
function totalFixasMes(mv){return (mv.fixas||[]).reduce((s,f)=>s+f.valor,0);}
function totalRec(){return getMesData().receitas.reduce((s,r)=>s+(r.recebido?r.valor:0),0);}
// Fixas (Seguro, Apple, Google, etc.) já estão embutidas na fatura do cartão (lançamento "Sicoob"),
// então não somam à parte aqui — senão o débito real da conta fica contado em dobro.
function totalDeb(){return getMesData().lancamentos.reduce((s,l)=>s+l.valor,0);}
function totalPago(){return getMesData().lancamentos.filter(l=>l.pago).reduce((s,l)=>s+l.valor,0);}
function totalPend(){return totalDeb()-totalPago();}
function disponivel(){return totalRec()-totalPago();}

function render(){
  const keys=Object.keys(data.meses).sort();
  if(!keys.length)return;
  if(!currentMes||!keys.includes(currentMes)){
    const todayKey=new Date().toISOString().slice(0,7);
    if(keys.includes(todayKey)){
      currentMes=todayKey;
    }else{
      let def=keys[keys.length-1];
      for(const k of keys){if(k>=todayKey){def=k;break;}}
      currentMes=def;
    }
  }
  renderHeader();
  renderVerse();
  renderSection(currentSection);
}

function renderHeader(){
  document.getElementById('month-label').textContent=nomeMesCurto(currentMes);
}

function renderVerse(){
  const[ref,txt]=versiculoDia();
  document.getElementById('verse-box').innerHTML=
    `<div class="verse-text">"${esc(txt)}"</div><div class="verse-ref">${esc(ref)}</div>`;
}

function renderSection(sec){
  if(sec==='dashboard') renderDashboard();
  else if(sec==='contas') renderContas();
  else if(sec==='receitas') renderReceita();
  else if(sec==='metas') renderPoupar();
  else if(sec==='relatorios') renderResumo();
  if(window.lucide) lucide.createIcons();
}

let CONTAS_STATE={busca:'',filtro:'todos',ordenar:'vencimento'};
const GROUP_META={
  atrasado:{label:'Atrasado',cls:'st-atrasado'},
  hoje:{label:'Hoje',cls:'st-hoje'},
  proximas:{label:'Próximas',cls:'st-pendente'},
  pagas:{label:'Pagas',cls:'st-pago'}
};
const BADGE_META={
  atrasado:{cls:'tag-atrasado',txt:'atrasado'},
  hoje:{cls:'tag-hoje',txt:'hoje'},
  proximas:{cls:'tag-unpaid',txt:'pendente'},
  pagas:{cls:'tag-paid',txt:'pago'}
};

function diaStatus(it){
  if(it.pago)return 'pagas';
  if(!it.data)return 'proximas';
  const[y,m]=currentMes.split('-').map(Number);
  const due=new Date(y,m-1,it.data);
  const now=new Date();
  const h0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(due<h0)return 'atrasado';
  if(due.getTime()===h0.getTime())return 'hoje';
  return 'proximas';
}

function setContasBusca(v){CONTAS_STATE.busca=v;renderContas();}
function setContasFiltro(f){CONTAS_STATE.filtro=f;renderContas();}
function setContasOrdenar(v){CONTAS_STATE.ordenar=v;renderContas();}

function toggleFixaPago(id){
  const el=document.getElementById(`item-f-${id}`);
  pulseAndRun(el,()=>{
    const mes=getMesData();
    const it=(mes.fixas||[]).find(f=>f.id===id);
    if(it){it.pago=!it.pago;}
    queuePersist({meses:{[currentMes]:mes}});
    renderSection(currentSection);
  });
}

function renderContas(){
  const mes=getMesData();
  const totalFixasV=totalFixasMes(mes);
  const totalVarV=(mes.lancamentos||[]).reduce((s,l)=>s+l.valor,0);
  document.getElementById('contas-stats').innerHTML=`
    <div class="mini-stat"><span>Fixas (na fatura)</span><b>${fmt(totalFixasV)}</b></div>
    <div class="mini-stat"><span>Débito da conta</span><b>${fmt(totalVarV)}</b></div>`;

  const FILTROS=[['todos','Todas'],['atrasado','Atrasado'],['hoje','Hoje'],['proximas','Próximas'],['pagas','Pagas']];
  document.getElementById('contas-filtros').innerHTML=FILTROS.map(([k,l])=>
    `<button class="chip ${CONTAS_STATE.filtro===k?'active':''}" onclick="setContasFiltro('${k}')">${l}</button>`
  ).join('')+`<span class="chip"><select onchange="setContasOrdenar(this.value)">
      <option value="vencimento"${CONTAS_STATE.ordenar==='vencimento'?' selected':''}>Vencimento</option>
      <option value="valor"${CONTAS_STATE.ordenar==='valor'?' selected':''}>Maior valor</option>
      <option value="categoria"${CONTAS_STATE.ordenar==='categoria'?' selected':''}>Categoria</option>
      <option value="status"${CONTAS_STATE.ordenar==='status'?' selected':''}>Status</option>
    </select></span>`;

  const lanc=(mes.lancamentos||[]).map(l=>({...l,_tipo:'lanc'}));
  const fixas=(mes.fixas||[]).map(f=>({...f,_tipo:'fixa'}));
  let todos=[...lanc,...fixas].map(it=>({...it,_status:diaStatus(it)}));

  const q=CONTAS_STATE.busca.trim().toLowerCase();
  if(q) todos=todos.filter(it=>it.descricao.toLowerCase().includes(q));
  if(CONTAS_STATE.filtro!=='todos') todos=todos.filter(it=>it._status===CONTAS_STATE.filtro);

  const ord=CONTAS_STATE.ordenar;
  const statusOrder={atrasado:0,hoje:1,proximas:2,pagas:3};
  todos.sort((a,b)=>{
    if(ord==='valor')return b.valor-a.valor;
    if(ord==='categoria')return (a.categoria||'').localeCompare(b.categoria||'');
    if(ord==='status')return statusOrder[a._status]-statusOrder[b._status];
    return (a.data||99)-(b.data||99);
  });

  const groups={atrasado:[],hoje:[],proximas:[],pagas:[]};
  for(const it of todos) groups[it._status].push(it);

  let html='';
  const order=CONTAS_STATE.filtro!=='todos'?[CONTAS_STATE.filtro]:['atrasado','hoje','proximas','pagas'];
  for(const key of order){
    const items=groups[key];
    if(!items.length)continue;
    html+=`<div class="grp-title ${GROUP_META[key].cls}"><span class="grp-dot"></span>${GROUP_META[key].label}<span class="grp-count">${items.length}</span></div>`;
    for(const it of items) html+=contaCardHtml(it);
  }
  if(!todos.length) html='<div class="empty">Nenhuma conta encontrada.</div>';
  document.getElementById('list-contas').innerHTML=html;
}

function contaCardHtml(it){
  const isLanc=it._tipo==='lanc';
  const pfx=isLanc?'g':'f';
  const badge=BADGE_META[it._status];
  const cls=it.pago?'paid':(it._status==='atrasado'?'late':'');
  const sub=[it.data?`Vence dia ${it.data}`:null,it.parcela||null,catLabel(it.categoria)].filter(Boolean).join(' · ');
  const editCall=isLanc?`openEditForm('gasto','${it.id}')`:`openEditForm('fixa','${it.id}')`;
  const toggleCall=isLanc?`togglePago('lanc','${it.id}')`:`toggleFixaPago('${it.id}')`;
  const deleteCall=isLanc?`confirmDelete('lanc','${it.id}','${esc(it.descricao)}')`:`confirmDelete('fixa','${it.id}','${esc(it.descricao)}')`;
  const lbl=it.pago?'Desfazer':'Pagar';
  const btnCls=it.pago?'btn-primary done':'btn-primary';
  return `<div class="item ${cls}" id="item-${pfx}-${it.id}">
    <div class="item-main">
      <div class="item-left">
        <div class="icon-chip">${iconTag(catIcon(it.categoria))}</div>
        <div class="item-text">
          <div class="item-desc">${esc(it.descricao)}</div>
          <div class="item-sub">${esc(sub)}</div>
        </div>
      </div>
      <div class="item-right">
        <div class="item-val">${fmt(it.valor)}</div>
        <span class="tag ${badge.cls}">${badge.txt}</span>
      </div>
    </div>
    <div class="item-actions">
      <button class="btn ${btnCls}" onclick="${toggleCall}">${lbl}</button>
      <button class="btn btn-icon" onclick="${editCall}">${iconTag('pencil')}</button>
      <button class="btn btn-icon btn-danger" onclick="${deleteCall}">${iconTag('trash-2')}</button>
    </div>
    <div id="confirm-${pfx}-${it.id}"></div>
  </div>`;
}

// PARCELAS
// ──────────────────────────────────────────
function renderParcelas(){
  const parcelasMap={};
  const allKeys=Object.keys(data.meses).sort();
  for(const mk of allKeys){
    if(mk>currentMes)break;
    for(const l of (data.meses[mk].lancamentos||[])){
      const pn=parcelaNum(l.parcela);
      if(!pn)continue;
      const[a,t]=pn;
      const key=l.descricao;
      parcelasMap[key]={atual:a,total:t,valor:l.valor,cat:l.categoria||'',obs:l.obs||'',mesKey:mk,id:l.id};
    }
  }
  const entries=Object.entries(parcelasMap).sort((a,b)=>a[0].localeCompare(b[0]));
  let html='';
  if(!entries.length){html='<div class="empty">Nenhuma parcela registrada.</div>';}
  for(const[desc,info] of entries){
    const{atual:a,total:t,valor,cat,mesKey,id}=info;
    const restam=t-a;
    const pct=(a/t*100).toFixed(0);
    const valRest=restam*valor;
    const faltaTxt=restam>0?`Falta ${fmt(valRest)} (${restam}x)`:'Quitada';
    const faltaCor=restam>0?'red':'green';
    html+=`<div class="item" id="item-p-${id}">

      <div class="parc-footer">
        <div style="font-size:11px;color:var(--text3);">${esc(catLabel(cat))} · ${fmt(valor)}/mês</div>
        <div style="font-size:12px;font-weight:700;" class="${faltaCor}">${faltaTxt}</div>

    </div>`;
  }
  document.getElementById('list-parcelas').innerHTML=html;
}

// ──────────────────────────────────────────
// POUPAR
// ──────────────────────────────────────────
function renderPoupar(){
  const p=data.poupanca||{objetivo:'',meta_total:0,depositos:[]};
  const deps=p.depositos||[];
  const meta=p.meta_total||0;
  const obj=p.objetivo||'Sem objetivo definido';

  // Lançamentos com categoria Poupança marcados como pagos
  const lancPoupa=[];
  for(const mk of Object.keys(data.meses).sort()){
    for(const l of (data.meses[mk].lancamentos||[])){
      if(l.categoria==='💰 Poupança'&&l.pago){
        lancPoupa.push({mes:mk,valor:l.valor,descricao:l.descricao||'Poupança',data:l.data||1});
      }
    }
  }
  const totalLanc=lancPoupa.reduce((s,l)=>s+l.valor,0);
  const totalDeps=deps.reduce((s,d)=>s+d.valor,0);
  const totalPoupado=totalDeps+totalLanc;
  const pct=meta>0?Math.min(totalPoupado/meta*100,100):0;

  document.getElementById('poupanca-card').innerHTML=`
    <div class="card">
      <div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Objetivo</div>
      <div style="font-weight:700;font-size:15px;margin-bottom:12px;">${esc(obj)}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;">
        <div><div class="s-label">Total poupado</div><div class="big-val green">${fmt(totalPoupado)}</div></div>
        <div style="text-align:right;"><div class="s-label">Meta</div><div style="font-size:16px;font-weight:700;color:var(--text2);">${meta>0?fmt(meta):'—'}</div></div>
      </div>
      <div class="prog-bg"><div class="prog-fill green" style="width:${pct.toFixed(0)}%;"></div></div>
      <div style="font-size:11px;color:var(--text3);text-align:right;margin-top:4px;">${pct.toFixed(0)}% da meta</div>
      <button class="btn btn-full" onclick="openForm('poupanca-cfg')">Editar objetivo e meta</button>
    </div>`;

  let html='';

  // Contribuições automáticas via gastos
  if(lancPoupa.length){
    html+=`<div class="sec-title">Contribuições via Gastos</div>`;
    for(const lp of [...lancPoupa].sort((a,b)=>b.mes.localeCompare(a.mes))){
      html+=`<div class="item" style="border-color:rgba(46,204,113,.3);">
        <div class="item-main">
          <div class="item-left">
            <div class="icon-chip">${iconTag('piggy-bank')}</div>
            <div class="item-text">
              <div class="item-desc">${esc(lp.descricao)}</div>
              <div class="item-sub">${nomeMesCurto(lp.mes)} · Dia ${lp.data} · gasto pago</div>
            </div>
          </div>
          <div class="item-right"><div class="item-val green">+${fmt(lp.valor)}</div></div>
        </div>
      </div>`;
    }
  }

  // Depósitos manuais
  if(deps.length){
    html+=`<div class="sec-title">Depósitos manuais</div>`;
    const deOrdenados=[...deps].sort((a,b)=>b.mes.localeCompare(a.mes));
    for(const dep of deOrdenados){
      const sub=[nomeMesCurto(dep.mes),dep.obs].filter(Boolean).join(' · ');
      html+=`<div class="item received" id="item-dep-${dep.id}">
        <div class="item-main">
          <div class="item-left">
            <div class="icon-chip">${iconTag('wallet')}</div>
            <div class="item-text"><div class="item-desc">Depósito</div><div class="item-sub">${esc(sub)}</div></div>
          </div>
          <div class="item-right"><div class="item-val green">${fmt(dep.valor)}</div></div>
        </div>
        <div class="item-actions">
          <button class="btn btn-primary" onclick="openEditDep('${dep.id}')">${iconTag('pencil')}Editar</button>
          <button class="btn btn-icon btn-danger" onclick="confirmDeleteDep('${dep.id}')">${iconTag('trash-2')}</button>
        </div>
        <div id="confirm-dep-${dep.id}"></div>
      </div>`;
    }
  }

  if(!lancPoupa.length&&!deps.length){
    html='<div class="empty">Nenhum depósito ainda.</div>';
  }

  document.getElementById('list-depositos').innerHTML=html;

  // Sobra por mês
  const recentKeys=Object.keys(data.meses).sort().slice(-6);
  let sobraHtml='';
  for(const mk of recentKeys){
    const mv=data.meses[mk];
    const mr=( mv.receitas||[]).reduce((s,r)=>s+(r.recebido?r.valor:0),0);
    const mt=( mv.lancamentos||[]).reduce((s,l)=>s+l.valor,0);
    const sd=mr-mt;
    const cor=sd>=0?'green':'red';
    const bold=mk===currentMes?'font-weight:700;':'';
    sobraHtml+=`<div class="hist-row">
      <div style="font-size:13px;${bold}">${nomeMesCurto(mk)}</div>
      <div class="s-val ${cor}">${fmt(sd)}</div>
    </div>`;
  }
  document.getElementById('sobra-meses').innerHTML=sobraHtml||'<div class="empty">Sem dados.</div>';
}

// ──────────────────────────────────────────
// RESUMO
// ──────────────────────────────────────────
function renderResumo(){
  const mes=getMesData();
  const lanc=mes.lancamentos||[];
  const total=totalDeb();
  // Por categoria (gastos variáveis — fixas já estão embutidas na fatura do cartão)
  const cats={};
  for(const l of lanc){const c=l.categoria||'🎯 Outros';cats[c]=(cats[c]||0)+l.valor;}
  const catOrd=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  let catHtml='';
  for(const[c,v] of catOrd){
    if(v<=0)continue;
    const pct=total>0?(v/total*100):0;
    catHtml+=`<div class="cat-row">
      <div class="icon-chip">${iconTag(catIcon(c))}</div>
      <div class="cat-info">
        <div class="cat-name">${esc(catLabel(c))}</div>
        <div class="prog-bg"><div class="prog-fill green" style="width:${pct.toFixed(0)}%;"></div></div>
      </div>
      <div class="cat-num">
        <div class="cat-val">${fmt(v)}</div>
        <div class="cat-pct">${pct.toFixed(0)}%</div>
      </div>
    </div>`;
  }
  document.getElementById('cat-chart').innerHTML=catHtml||'<div class="empty">Sem gastos.</div>';

  // Histórico
  const histKeys=Object.keys(data.meses).sort().slice(-6);
  let histHtml='';
  for(const mk of histKeys){
    const mv=data.meses[mk];
    const mt=( mv.lancamentos||[]).reduce((s,l)=>s+l.valor,0);
    const mr=( mv.receitas||[]).reduce((s,r)=>s+(r.recebido?r.valor:0),0);
    const sd=mr-mt;
    const cor=sd>=0?'green':'red';
    const bold=mk===currentMes?'font-weight:700;':'color:var(--text2);';
    histHtml+=`<div class="hist-row">
      <div style="font-size:13px;${bold}">${nomeMesCurto(mk)}</div>
      <div style="text-align:right;">
        <div class="s-val red">${fmt(mt)}</div>
        <div style="font-size:11px;" class="${cor}">saldo ${fmt(sd)}</div>
      </div>
    </div>`;
  }
  document.getElementById('historico').innerHTML=histHtml||'<div class="empty">Sem histórico.</div>';

  // Template fixas
  const tpl=data.template_fixas||[];
  let tplHtml=tpl.map(t=>`<div class="hist-row">
    <div style="font-size:13px;color:var(--text2);">${esc(t.descricao)}</div>
    <div style="font-weight:600;">${fmt(t.valor)}</div>
  </div>`).join('');
  tplHtml+=`<button class="btn btn-full" onclick="openForm('template')">Editar template</button>`;
  document.getElementById('template-fixas').innerHTML=tplHtml;

  renderParcelas();
}

// ═══════════════════════════════════════════
// TOGGLE PAID / RECEIVED
// ═══════════════════════════════════════════
function pulseAndRun(el,run){
  if(el){
    el.style.transition='transform 150ms var(--ease),opacity 150ms var(--ease)';
    el.style.transform='scale(.98)';
    el.style.opacity='.7';
    setTimeout(run,150);
  }else{run();}
}
function togglePago(tipo,id){
  const pfx=tipo==='lanc'?'g':'r';
  const el=document.getElementById(`item-${pfx}-${id}`);
  pulseAndRun(el,()=>{
    const mes=getMesData();
    if(tipo==='lanc'){
      const it=mes.lancamentos.find(l=>l.id===id);
      if(it){it.pago=!it.pago;}
    }else if(tipo==='receita'){
      const it=mes.receitas.find(r=>r.id===id);
      if(it){it.recebido=!it.recebido;}
    }
    queuePersist({meses:{[currentMes]:mes}});
    renderHeader();
    renderSection(currentSection);
  });
}

// ═══════════════════════════════════════════
// DELETE CONFIRM
// ═══════════════════════════════════════════
function confirmDelete(tipo,id,desc){
  const pfx=tipo==='lanc'?'g':tipo==='fixa'?'f':'r';
  const el=document.getElementById(`confirm-${pfx}-${id}`);
  if(!el)return;
  el.innerHTML=`<div class="confirm-bar">
    <p>Excluir "${esc(desc)}"?</p>
    <div class="confirm-actions">
      <button class="btn btn-sm btn-danger" onclick="doDelete('${tipo}','${id}')">Excluir</button>
      <button class="btn btn-sm" onclick="cancelConfirm('${pfx}','${id}')">Cancelar</button>
    </div>
  </div>`;
}
function cancelConfirm(pfx,id){
  const el=document.getElementById(`confirm-${pfx}-${id}`);
  if(el)el.innerHTML='';
}
function doDelete(tipo,id){
  const pfx=tipo==='lanc'?'g':tipo==='fixa'?'f':'r';
  const el=document.getElementById(`item-${pfx}-${id}`);
  const run=()=>{
    const mes=getMesData();
    if(tipo==='lanc'){
      mes.lancamentos=mes.lancamentos.filter(l=>l.id!==id);
      queuePersist({meses:{[currentMes]:mes}});
    }else if(tipo==='fixa'){
      const it=mes.fixas.find(f=>f.id===id);
      mes.fixas=mes.fixas.filter(f=>f.id!==id);
      const tocados=it?propagarFixaDelete(it.descricao):[];
      const patch={config:configSnapshot(),meses:{[currentMes]:mes}};
      for(const mk of tocados)patch.meses[mk]=data.meses[mk];
      queuePersist(patch);
    }else if(tipo==='receita'){
      mes.receitas=mes.receitas.filter(r=>r.id!==id);
      queuePersist({meses:{[currentMes]:mes}});
    }
    renderHeader();
    renderSection(currentSection);
    showToast('Item excluído');
  };
  if(el){el.classList.add('leaving');setTimeout(run,180);}else{run();}
}
function confirmDeleteParc(id,desc,mesKey){
  const el=document.getElementById(`confirm-p-${id}`);
  if(!el)return;
  el.innerHTML=`<div class="confirm-bar">
    <p>Excluir parcela "${esc(desc)}"?</p>
    <div class="confirm-actions">
      <button class="btn btn-sm btn-danger" onclick="doDeleteParc('${id}','${mesKey}')">Excluir</button>
      <button class="btn btn-sm" onclick="document.getElementById('confirm-p-${id}').innerHTML=''">Cancelar</button>
    </div>
  </div>`;
}
function doDeleteParc(id,mesKey){
  const el=document.getElementById(`item-p-${id}`);
  const run=()=>{
    const mv=data.meses[mesKey];
    if(mv){
      mv.lancamentos=mv.lancamentos.filter(l=>l.id!==id);
      queuePersist({meses:{[mesKey]:mv}});
    }
    renderParcelas();
    if(window.lucide) lucide.createIcons();
    showToast('Parcela excluída');
  };
  if(el){el.classList.add('leaving');setTimeout(run,180);}else{run();}
}
function confirmDeleteDep(id){
  const el=document.getElementById(`confirm-dep-${id}`);
  if(!el)return;
  el.innerHTML=`<div class="confirm-bar">
    <p>Excluir depósito?</p>
    <div class="confirm-actions">
      <button class="btn btn-sm btn-danger" onclick="doDeleteDep('${id}')">Excluir</button>
      <button class="btn btn-sm" onclick="document.getElementById('confirm-dep-${id}').innerHTML=''">Cancelar</button>
    </div>
  </div>`;
}
function doDeleteDep(id){
  const el=document.getElementById(`item-dep-${id}`);
  const run=()=>{
    data.poupanca.depositos=data.poupanca.depositos.filter(d=>d.id!==id);
    queuePersist({config:configSnapshot()});
    renderPoupar();
    if(window.lucide) lucide.createIcons();
    showToast('Depósito excluído');
  };
  if(el){el.classList.add('leaving');setTimeout(run,180);}else{run();}
}

function openForm(tipo){
  const sheet=document.getElementById('form-sheet');
  sheet.innerHTML=buildForm(tipo,null);
  document.getElementById('form-overlay').style.display='flex';
  setTimeout(()=>sheet.querySelector('input,select')?.focus(),100);
}
function openEditForm(tipo,id){
  const mes=getMesData();
  let item=null;
  if(tipo==='gasto') item=(mes.lancamentos||[]).find(l=>l.id===id);
  else if(tipo==='fixa') item=(mes.fixas||[]).find(f=>f.id===id);
  else if(tipo==='receita') item=(mes.receitas||[]).find(r=>r.id===id);
  if(!item)return;
  const sheet=document.getElementById('form-sheet');
  sheet.innerHTML=buildForm(tipo,item);
  document.getElementById('form-overlay').style.display='flex';
}
function openEditParc(id,desc){
  // Find item across months
  let item=null,mesKey=null;
  for(const mk of Object.keys(data.meses).sort()){
    item=(data.meses[mk].lancamentos||[]).find(l=>l.id===id);
    if(item){mesKey=mk;break;}
  }
  if(!item)return;
  const sheet=document.getElementById('form-sheet');
  sheet.innerHTML=buildFormParc(item,mesKey);
  document.getElementById('form-overlay').style.display='flex';
}
function openEditDep(id){
  const dep=(data.poupanca.depositos||[]).find(d=>d.id===id);
  if(!dep)return;
  const sheet=document.getElementById('form-sheet');
  sheet.innerHTML=buildFormDep(dep);
  document.getElementById('form-overlay').style.display='flex';
}
function closeForm(){
  document.getElementById('form-overlay').style.display='none';
}

function catOptions(cats,selected){
  return cats.map(c=>`<option value="${esc(c)}"${c===selected?' selected':''}>${esc(catLabel(c))}</option>`).join('');
}
function mesOptions(selected){
  return Object.keys(data.meses).sort().reverse().map(k=>
    `<option value="${k}"${k===selected?' selected':''}>${nomeMesCurto(k)}</option>`).join('');
}

  </div>

    <input class="form-input" id="fi-obs" placeholder="Ex: poupança do mês..." value="${esc(t.obs||'')}">
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" style="flex:2;" onclick="submitDep('${dep?dep.id:''}')">Salvar</button>
    <button class="btn" onclick="closeForm()">Cancelar</button>
  </div>`;
}

function buildFormParc(item,mesKey){
  const pn=parcelaNum(item.parcela)||[1,1];
  return `<div class="form-title">Editar Parcela</div>
  <div class="form-group"><label class="form-label">Descrição *</label>
    <input class="form-input" id="fi-desc" value="${esc(item.descricao)}">
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Valor/parcela (R$)</label>
      <input class="form-input" id="fi-val" type="number" step="0.01" value="${item.valor}">
    </div>
    <div class="form-group"><label class="form-label">Categoria</label>
      <select class="form-input" id="fi-cat">${catOptions(CATS,item.categoria)}</select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Parcela atual</label>
      <input class="form-input" id="fi-pat" type="number" min="0" value="${pn[0]}">
    </div>
    <div class="form-group"><label class="form-label">Total parcelas</label>
      <input class="form-input" id="fi-ptot" type="number" min="1" value="${pn[1]}">
    </div>
  </div>
  <div class="form-group"><label class="form-label">Observação</label>
    <input class="form-input" id="fi-obs" value="${esc(item.obs||'')}">
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" style="flex:2;" onclick="submitParc('${item.id}','${mesKey}')">Salvar</button>
    <button class="btn" onclick="closeForm()">Cancelar</button>
  </div>`;

function g(id){return document.getElementById(id);}
function gv(id,fallback=''){const e=g(id);return e?e.value.trim():fallback;}
function gn(id){return parseFloat(g(id)?.value||0)||0;}
function gb(id){return g(id)?.checked||false;}

// ═══════════════════════════════════════════
// PROPAGAÇÃO DE FIXAS PARA MESES FUTUROS
// ═══════════════════════════════════════════
function normDesc(s){return (s||'').trim().toLowerCase();}
function futureMonthKeys(){return Object.keys(data.meses).filter(k=>k>currentMes).sort();}

function upsertTemplateFixa(desc,valor,categoria,oldDesc){
  if(!data.template_fixas)data.template_fixas=[];
  const alvo=normDesc(oldDesc||desc);
  const idx=data.template_fixas.findIndex(t=>normDesc(t.descricao)===alvo);
  if(idx>=0)data.template_fixas[idx]={descricao:desc,valor,categoria};
  else data.template_fixas.push({descricao:desc,valor,categoria});
}

function propagarFixaAdd(obj){
  const alvo=normDesc(obj.descricao);
  const tocados=[];
  for(const mk of futureMonthKeys()){
    const mv=data.meses[mk];
    if(!mv.fixas)mv.fixas=[];
    if(mv.fixas.some(f=>normDesc(f.descricao)===alvo))continue;
    mv.fixas.push({id:uid(),descricao:obj.descricao,valor:obj.valor,categoria:obj.categoria,pago:false});
    tocados.push(mk);
  }
  upsertTemplateFixa(obj.descricao,obj.valor,obj.categoria);
  return tocados;
}

function propagarFixaEdit(oldDesc,obj){
  const alvo=normDesc(oldDesc);
  const tocados=[];
  for(const mk of futureMonthKeys()){
    const mv=data.meses[mk];
    const f=(mv.fixas||[]).find(f=>normDesc(f.descricao)===alvo);
    if(f){f.descricao=obj.descricao;f.valor=obj.valor;f.categoria=obj.categoria;tocados.push(mk);}
  }
  upsertTemplateFixa(obj.descricao,obj.valor,obj.categoria,oldDesc);
  return tocados;
}

function propagarFixaDelete(desc){
  const alvo=normDesc(desc);
  const tocados=[];
  for(const mk of futureMonthKeys()){
    const mv=data.meses[mk];
    if(!mv.fixas)continue;
    const antes=mv.fixas.length;
    mv.fixas=mv.fixas.filter(f=>normDesc(f.descricao)!==alvo);
    if(mv.fixas.length!==antes)tocados.push(mk);
  }
  if(data.template_fixas)data.template_fixas=data.template_fixas.filter(t=>normDesc(t.descricao)!==alvo);
  return tocados;
}

// ═══════════════════════════════════════════
// PROPAGAÇÃO DE PARCELAS PARA MESES FUTUROS
// ═══════════════════════════════════════════
function monthsAfter(mesKey){return Object.keys(data.meses).filter(k=>k>mesKey).sort();}

function propagarParcela(mesKey,descricao,aBase,tBase,valor,categoria,dia,obs){
  const alvo=normDesc(descricao);
  const tocados=[];
  let a=aBase;
  for(const mk of monthsAfter(mesKey)){
    const mv=data.meses[mk];
    if(!mv)continue;
    if(!mv.lancamentos)mv.lancamentos=[];
    a++;
    const idx=mv.lancamentos.findIndex(l=>normDesc(l.descricao)===alvo&&parcelaNum(l.parcela));
    if(a>tBase){
      if(idx>=0){mv.lancamentos.splice(idx,1);tocados.push(mk);}
      continue;
    }
    const parcela=`${a}/${tBase}`;
    if(idx>=0){
      const it=mv.lancamentos[idx];
      mv.lancamentos[idx]={...it,descricao,valor,categoria,parcela};
    }else{
      mv.lancamentos.push({id:uid(),data:dia||1,descricao,valor,parcela,categoria,pago:false,obs:obs||''});
    }
    tocados.push(mk);
  }
  return tocados;
}

function submitForm(tipo,editId){
  const mes=getMesData();
  const desc=gv('fi-desc');
  const val=gn('fi-val');
  if(!desc){showToast('Preencha a descrição');return;}
  if(val<=0&&tipo!=='fixa'&&tipo!=='gasto'){showToast('Informe um valor');return;}

  if(tipo==='gasto'){
    const obj={id:editId||uid(),data:parseInt(gv('fi-dia'))||today(),
      descricao:desc,valor:val,parcela:gv('fi-parc'),
      categoria:gv('fi-cat'),pago:gb('fi-pago'),obs:gv('fi-obs')};
    if(editId){const idx=mes.lancamentos.findIndex(l=>l.id===editId);if(idx>=0)mes.lancamentos[idx]=obj;}
    else mes.lancamentos.push(obj);
    const patchGasto={meses:{[currentMes]:mes}};
    const pnGasto=parcelaNum(obj.parcela);
    if(pnGasto){
      const tocados=propagarParcela(currentMes,obj.descricao,pnGasto[0],pnGasto[1],obj.valor,obj.categoria,obj.data,obj.obs);
      for(const mk of tocados)patchGasto.meses[mk]=data.meses[mk];
    }
    queuePersist(patchGasto);
  }else if(tipo==='fixa'){
    const obj={id:editId||uid(),descricao:desc,valor:val,categoria:gv('fi-cat')};
    let tocados=[];
    if(editId){
      const idx=mes.fixas.findIndex(f=>f.id===editId);
      if(idx>=0){
        const oldDesc=mes.fixas[idx].descricao;
        mes.fixas[idx]=obj;
        tocados=propagarFixaEdit(oldDesc,obj);
      }
    }else{
      mes.fixas.push(obj);
      tocados=propagarFixaAdd(obj);
    }
    const patch={config:configSnapshot(),meses:{[currentMes]:mes}};
    for(const mk of tocados)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }else if(tipo==='receita'){
    const obj={id:editId||uid(),data:parseInt(gv('fi-dia'))||today(),
      descricao:desc,valor:val,categoria:gv('fi-cat'),recebido:gb('fi-rec'),obs:gv('fi-obs')};
    if(editId){const idx=mes.receitas.findIndex(r=>r.id===editId);if(idx>=0)mes.receitas[idx]=obj;}
    else mes.receitas.push(obj);
    queuePersist({meses:{[currentMes]:mes}});
  }
  closeForm();renderHeader();renderSection(currentSection);
  showToast(editId?'Salvo!':'Adicionado!');
}

function submitDep(editId){
  const val=gn('fi-val');const mes=gv('fi-mes');
  if(val<=0){showToast('Informe um valor');return;}
  if(!data.poupanca)data.poupanca={objetivo:'',meta_total:0,depositos:[]};
  const obj={id:editId||uid(),mes,valor:val,obs:gv('fi-obs')};
  if(editId){const idx=data.poupanca.depositos.findIndex(d=>d.id===editId);if(idx>=0)data.poupanca.depositos[idx]=obj;}
  else data.poupanca.depositos.push(obj);
  queuePersist({config:configSnapshot()});
  closeForm();renderPoupar();showToast(editId?'Salvo!':'Depósito adicionado!');
}

function submitPoupancaCfg(){
  if(!data.poupanca)data.poupanca={objetivo:'',meta_total:0,depositos:[]};
  data.poupanca.objetivo=gv('fi-obj');
  data.poupanca.meta_total=gn('fi-meta');
  queuePersist({config:configSnapshot()});
  closeForm();renderPoupar();showToast('Objetivo salvo!');
}

function submitParc(id,mesKey){
  const mv=data.meses[mesKey];
  if(!mv)return;
  const it=mv.lancamentos.find(l=>l.id===id);
  if(!it)return;
  it.descricao=gv('fi-desc');
  it.valor=gn('fi-val');
  it.parcela=`${gv('fi-pat')}/${gv('fi-ptot')}`;
  it.categoria=gv('fi-cat');
  it.obs=gv('fi-obs');
  const patchParc={meses:{[mesKey]:mv}};
  const pnParc=parcelaNum(it.parcela);
  if(pnParc){
    const tocados=propagarParcela(mesKey,it.descricao,pnParc[0],pnParc[1],it.valor,it.categoria,it.data,it.obs);
    for(const mk of tocados)patchParc.meses[mk]=data.meses[mk];
  }
  queuePersist(patchParc);
  closeForm();renderParcelas();showToast('Parcela salva!');
}

function submitTemplate(count){
  const tpl=[];
  for(let i=0;i<count;i++){
    const d=gv(`tpl-desc-${i}`);
    const v=parseFloat(g(`tpl-val-${i}`)?.value||0);
    if(d&&v>0) tpl.push({descricao:d,valor:v,categoria:gv(`tpl-cat-${i}`)});
  }
  data.template_fixas=tpl;
  queuePersist({config:configSnapshot()});
  closeForm();renderResumo();showToast('Template salvo!');
}

// ═══════════════════════════════════════════
// MONTH NAVIGATION
// ═══════════════════════════════════════════
document.getElementById('prev-month').onclick=()=>{
  const keys=Object.keys(data.meses).sort();
  const idx=keys.indexOf(currentMes);
  if(idx>0){currentMes=keys[idx-1];render();}
};
document.getElementById('next-month').onclick=()=>{
  const keys=Object.keys(data.meses).sort();
  const idx=keys.indexOf(currentMes);
  if(idx<keys.length-1){currentMes=keys[idx+1];render();}
};

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init(){
  await loadData();
  // Ensure retrocompat fields
  if(!data.poupanca) data.poupanca={objetivo:'',meta_total:0,depositos:[]};
  if(!data.template_fixas) data.template_fixas=[];
  if(!data.saldo_inicial) data.saldo_inicial=0;
  if(!data.meses) data.meses={};
  Object.values(data.meses).forEach(m=>{
    if(!m.receitas) m.receitas=[];
    if(!m.meta_poupanca) m.meta_poupanca=0;
  });
  const novos=garantirMeses();
  if(novos.length){
    const patch={meses:{}};
    for(const mk of novos)patch.meses[mk]=data.meses[mk];
    queuePersist(patch);
  }
  render();
}
init();

// Keyboard: Escape closes form
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();});
</script>
